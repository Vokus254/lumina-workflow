<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA Abschluss-Cockpit – Datenraum-Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --page-bg: #F7F7F8;
    --text-primary: #0D0D0D;
    --text-secondary: #6E6E80;
    --text-faint: #A0A0AC;
    --hover: #F5F5F6;
    --border: #E5E5E5;
    --accent: #10A37F;
    --done-bg: #E6F4EF;
    --done-text: #0F8F6E;
    --pending-bg: #F1F1F3;
    --pending-text: #6E6E80;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; }

  body{
    font-family: 'Inter', ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    background: var(--page-bg);
    -webkit-font-smoothing: antialiased;
  }

  .page{ max-width: 1160px; margin: 0 auto; padding: 40px 32px 90px; }

  .header{ display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .header-brand{ display: flex; align-items: center; gap: 14px; }
  .brand-icon{ width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #6366F1, #10A37F); flex-shrink: 0; }
  .header h1{ font-size: 15px; font-weight: 700; margin: 0; }
  .header p{ font-size: 12.5px; color: var(--text-secondary); margin: 1px 0 0; }

  /* ---------- Kontextzeile (immer gleiche Höhe, alle Ebenen) ---------- */
  .context-row{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    min-height: 46px;
  }

  .context-left{ min-width: 0; }

  .breadcrumb-trail{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .breadcrumb-trail .crumb{ cursor: pointer; }
  .breadcrumb-trail .crumb:hover{ color: var(--text-primary); text-decoration: underline; }
  .breadcrumb-trail .crumb.current{ color: var(--text-primary); font-weight: 600; cursor: default; }
  .breadcrumb-trail .crumb.current:hover{ text-decoration: none; }
  .breadcrumb-trail .sep{ color: var(--text-faint); }

  .context-desc{
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 560px;
  }

  .status-pill{
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; background: var(--pending-bg); color: var(--pending-text);
    flex-shrink: 0; white-space: nowrap;
  }
  .status-pill.complete{ background: var(--done-bg); color: var(--done-text); }
  .status-pill .dot{ width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- Kachel-Grid (alle Ebenen, feste Größe) ---------- */
  .grid{ display: flex; flex-wrap: wrap; gap: 14px; }

  /* Oberste Ebene: die acht Stationen sollen ohne Scrollen auf einen Blick sichtbar
     sein. Ihre Titel sind kurz, deshalb quadratisch und kompakt - die festen 204x240
     der tieferen Ebenen brauchen sie nicht und erzeugten nur Leerraum zwischen Titel
     und Fortschrittsbalken. */
  .grid.grid-stations{
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px;
  }
  .grid-stations .tile{
    width: auto; height: auto; aspect-ratio: 1 / 1;
    padding: 12px; gap: 4px; justify-content: flex-start;
  }
  .grid-stations .tile-num{ height: 20px; min-width: 20px; padding: 0 6px; font-size: 11px; }
  .grid-stations .tile-title{
    font-size: 12px; line-height: 1.28; -webkit-line-clamp: 4; margin-top: 2px;
  }
  .grid-stations .tile-bottom{ margin-top: auto; gap: 4px; }
  .grid-stations .tile-frac, .grid-stations .tile-due{ font-size: 10px; }
  @media (max-width: 1180px){ .grid.grid-stations{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 640px){ .grid.grid-stations{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile{
    all: unset; box-sizing: border-box; cursor: pointer;
    /* Höher als früher (204): die Maßnahmentitel aus der PBC-Liste sind teils sehr lang
       und wurden nach vier Zeilen abgeschnitten. */
    width: 204px; height: 240px; flex-shrink: 0;
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 15px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .tile:hover{ border-color: #CFCFD4; transform: translateY(-2px); }
  .tile:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Kennung der Kachel. Breite richtet sich nach dem Inhalt, damit auch ein
     vollständiger Prozessschritt-Code wie "3.12.1.5" hineinpasst. */
  .tile-num{
    align-self: flex-start; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 7px;
    background: #EFEFF1; color: var(--text-secondary);
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em;
    display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  }
  .tile.is-complete .tile-num{ background: var(--done-bg); color: var(--done-text); }

  .tile-title{
    flex: 1 1 auto; min-height: 0;
    font-size: 13px; font-weight: 600; line-height: 1.34; color: var(--text-primary);
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }

  .tile-bottom{ display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .tile-bar-track{ height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .tile-bar-fill{ height: 100%; background: var(--accent); border-radius: 999px; }
  .tile-meta{ display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .tile-frac{ font-size: 11px; font-weight: 600; color: var(--text-faint); }
  .tile.is-complete .tile-frac{ color: var(--done-text); }
  /* Fälligkeit direkt auf der Kachel - vorher nur nach dem Öffnen im Status-Panel. */
  .tile-due{ font-size: 11px; font-weight: 650; color: var(--text-secondary); white-space: nowrap; }
  .tile-due.is-overdue{ color: #b42318; }
  .tile-due.is-soon{ color: #8a5a00; }

  /* Leaf-Kacheln (Teilschritte) */
  .tile-leaf .tile-check{
    align-self: flex-end;
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #C9C9CE; background: #fff; position: relative;
  }
  .tile-leaf.is-complete .tile-check{ background: var(--accent); border-color: var(--accent); }
  .tile-leaf.is-complete .tile-check::after{
    content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(40deg);
  }
  .tile-leaf.is-complete .tile-title{ color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .tile-leaf .tile-form-badge{
    align-self: flex-end; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent); background: var(--done-bg); padding: 3px 7px; border-radius: 999px;
  }

  /* ---------- Stammdaten-Formular ---------- */
  .form-card{
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 30px 30px; max-width: 720px;
  }
  .form-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; margin-bottom: 26px; }
  .form-field{ display: flex; flex-direction: column; gap: 6px; }
  .form-field.span-2{ grid-column: 1 / -1; }
  .form-field label{ font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .form-field input, .form-field select{
    font-family: inherit; font-size: 14px; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text-primary);
  }
  .form-field input:focus, .form-field select:focus{ outline: 1.5px solid var(--accent); outline-offset: -1px; }
  .form-field input::placeholder{ color: var(--text-faint); }

  .form-actions{ display: flex; align-items: center; gap: 12px; }
  .btn-save{
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #fff;
    background: var(--accent); padding: 9px 18px; border-radius: 8px;
  }
  .btn-save:hover{ opacity: 0.92; }
  .form-saved-note{ font-size: 12.5px; color: var(--done-text); font-weight: 600; }

  /* ---------- Rollen-Verwaltung ---------- */
  .roles-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px 28px; max-width: 980px; }

  .roles-head-row, .roles-row{
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 1.5fr 30px;
    gap: 12px;
    align-items: center;
  }
  .roles-head-row{
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .roles-head-row span{
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint);
  }
  .roles-row{
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .roles-row:last-of-type{ border-bottom: none; }

  .roles-row input{
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13.5px;
    padding: 8px 9px; border-radius: 7px; border: 1px solid var(--border); background: #fff; color: var(--text-primary);
  }
  .roles-row input:focus{ outline: 1.5px solid var(--accent); outline-offset: -1px; }
  .roles-row input::placeholder{ color: var(--text-faint); }

  .role-remove{
    all: unset; cursor: pointer; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--text-faint); justify-self: center;
  }
  .role-remove:hover{ background: #FBE9E9; color: #C0392B; }

  .btn-add-role{
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--accent);
    padding: 9px 16px; border-radius: 8px; border: 1px dashed var(--accent);
    display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
  }
  .btn-add-role:hover{ background: var(--done-bg); }

  @media (max-width: 900px){
    .roles-head-row{ display: none; }
    .roles-row{
      grid-template-columns: 1fr 1fr;
      row-gap: 8px;
      padding: 14px 0;
    }
    .roles-row .role-remove{ grid-column: 2; justify-self: end; }
  }

  /* ---------- Ordnerstruktur ---------- */
  .tree-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px 26px 26px; max-width: 760px; }
  .tree-toolbar{ display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .tree-toggle-all{
    all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
    padding: 5px 10px; border-radius: 7px;
  }
  .tree-toggle-all:hover{ background: var(--hover); color: var(--text-primary); }

  .tree-row{
    display: flex; align-items: center; gap: 10px;
    padding: 8px 6px; border-radius: 8px; cursor: default;
  }
  .tree-row.has-children{ cursor: pointer; }
  .tree-row.has-children:hover{ background: var(--hover); }

  .tree-chevron{
    width: 16px; height: 16px; flex-shrink: 0; color: var(--text-faint);
    display: flex; align-items: center; justify-content: center; transition: transform .12s ease;
  }
  .tree-row.is-open > .tree-chevron{ transform: rotate(90deg); }
  .tree-chevron.spacer{ visibility: hidden; }

  .tree-num{
    font-family: 'Inter', monospace; font-size: 11.5px; font-weight: 700; color: var(--text-faint);
    background: #EFEFF1; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; min-width: 32px; text-align: center;
  }

  .tree-name{ font-size: 13.5px; color: var(--text-primary); flex:1; min-width:0; }
  .tree-row[data-depth="0"] .tree-name{ font-weight: 700; }
  .tree-row[data-depth="1"] .tree-name{ font-weight: 600; }
  .tree-actions{ display:flex; align-items:center; gap:4px; opacity:0; transition:opacity .12s ease; margin-left:auto; }
  .tree-row:hover .tree-actions, .tree-row:focus-within .tree-actions{ opacity:1; }
  .tree-action{ all:unset; box-sizing:border-box; cursor:pointer; width:27px; height:27px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; color:var(--text-faint); border:1px solid transparent; font-size:16px; font-weight:600; }
  .tree-action:hover{ background:#fff; border-color:var(--border); color:var(--text-primary); }
  .tree-action.danger:hover{ background:#FBE9E9; border-color:#F2CACA; color:#B42318; }
  .tree-editor-note{ font-size:12px; color:var(--text-faint); margin-right:auto; }
  .tree-toolbar{ align-items:center; gap:8px; }
  .tree-add-root{ all:unset; box-sizing:border-box; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--accent); padding:6px 10px; border-radius:7px; border:1px dashed var(--accent); }
  .tree-add-root:hover{ background:var(--done-bg); }
  @media(max-width:760px){ .tree-actions{opacity:1;} .tree-editor-note{display:none;} }

  .tree-children{ display: none; }
  .tree-children.is-open{ display: block; }

  /* ---------- Anlagenspiegel / Tabellen-Ansicht ---------- */
  .table-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px 26px; max-width: 100%; }
  .table-caption{ font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px; }

  .aspiegel-wrap{ overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .aspiegel-table{ border-collapse: collapse; width: 100%; min-width: 1180px; font-size: 11.5px; }
  .aspiegel-table th, .aspiegel-table td{
    padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  .aspiegel-table th{
    text-align: right; font-weight: 600; color: var(--text-secondary); font-size: 10.5px;
    background: #FAFAFB; position: sticky; top: 0;
  }
  .aspiegel-table th:first-child, .aspiegel-table td:first-child{
    text-align: left; position: sticky; left: 0; background: #fff; min-width: 260px; white-space: normal;
  }
  .aspiegel-table th:first-child{ background: #FAFAFB; }
  .aspiegel-table tr.section td{ font-weight: 700; background: #F7F7F8; }
  .aspiegel-table tr.section td:first-child{ background: #F7F7F8; }
  .aspiegel-table tr.subtotal td{ font-weight: 700; border-top: 1.5px solid var(--text-faint); }
  .aspiegel-table tr.total td{ font-weight: 700; background: var(--done-bg); border-top: 2px solid var(--done-text); }
  .aspiegel-table tr.total td:first-child{ background: var(--done-bg); }
  .aspiegel-table tr td:first-child{ padding-left: 14px; }
  .aspiegel-table tr.section td:first-child, .aspiegel-table tr.subtotal td:first-child, .aspiegel-table tr.total td:first-child{ padding-left: 9px; }

  .recon-block{ margin-top: 24px; }
  .recon-heading{ font-size: 12.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .recon-notes{ list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .recon-notes li{
    font-size: 12.5px; line-height: 1.55; color: var(--text-secondary);
    padding: 9px 12px; background: #FAFAFB; border-radius: 8px; border: 1px solid var(--border);
  }

  /* ---------- Import-Ansicht ---------- */
  .import-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px 28px; max-width: 900px; }

  .import-dropzone{
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 44px 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .import-dropzone .icon{ color: var(--text-faint); }
  .import-dropzone .hint{ font-size: 13px; color: var(--text-secondary); max-width: 46ch; line-height: 1.55; }
  .import-dropzone .cols{ font-size: 12px; color: var(--text-faint); font-family: 'Inter', monospace; }

  .btn-choose-file{
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #fff;
    background: var(--accent); padding: 9px 18px; border-radius: 8px; margin-top: 4px;
  }
  .btn-choose-file:hover{ opacity: 0.92; }

  .import-summary{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .import-badge{
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--pending-bg); color: var(--pending-text);
  }
  .import-badge.ok{ background: var(--done-bg); color: var(--done-text); }
  .import-badge.warn{ background: var(--wip-bg); color: var(--wip-text); }
  .import-filename{ font-size: 13px; color: var(--text-secondary); }
  .import-filename strong{ color: var(--text-primary); }

  .btn-secondary{
    all: unset; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  }
  .btn-secondary:hover{ background: var(--hover); color: var(--text-primary); }

  .import-more-note{ font-size: 12px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- Berichtsstruktur (editierbar) ---------- */
  .mapping-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px 26px; }
  .mapping-toolbar{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .mapping-count{ font-size: 12.5px; color: var(--text-secondary); }

  .mapping-wrap{ overflow-x: auto; overflow-y: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 10px; }
  .mapping-table{ border-collapse: collapse; width: 100%; min-width: 1400px; font-size: 12px; }
  .mapping-table th, .mapping-table td{ border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; }
  .mapping-table th:last-child, .mapping-table td:last-child{ border-right: none; }
  .mapping-table th{
    text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 10.5px;
    background: #FAFAFB; position: sticky; top: 0; z-index: 2; padding: 8px 10px;
  }
  .mapping-table th.col-del{ width: 34px; }
  .mapping-table td.col-del{ text-align: center; }
  .mapping-table input{
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12px;
    padding: 7px 9px; border: none; background: transparent; color: var(--text-primary);
  }
  .mapping-table input:focus{ outline: 1.5px solid var(--accent); outline-offset: -1px; background: #fff; }
  .mapping-table tr:hover td{ background: #FAFAFB; }
  .mapping-table tr:hover input{ background: transparent; }

  .mapping-accordion-wrap{ max-height: 620px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 4px 8px; }
  .mapping-leaf-tag{
    font-family: 'Inter', monospace; font-size: 10.5px; font-weight: 600; color: var(--text-faint);
    background: #EFEFF1; padding: 2px 7px; border-radius: 999px; margin-left: 8px;
  }

  .row-remove{
    all: unset; cursor: pointer; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--text-faint);
  }
  .row-remove:hover{ background: #FBE9E9; color: #C0392B; }

  .btn-add-row{
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--accent);
    padding: 9px 16px; border-radius: 8px; border: 1px dashed var(--accent);
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
  }
  .btn-add-row:hover{ background: var(--done-bg); }

  /* ---------- PBC-Maßnahmenliste ---------- */
  .pbc-card{ background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px 26px; }
  .pbc-toolbar{ display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  .pbc-toolbar input[type="text"]{
    font-family: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text-primary); min-width: 200px;
  }
  .pbc-toolbar select{
    font-family: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text-primary); max-width: 220px;
  }
  .pbc-toolbar .pbc-count{ font-size: 12.5px; color: var(--text-secondary); margin-left: auto; }
  .pbc-toolbar .btn-secondary{ padding: 7px 12px; }

  .pbc-wrap{ overflow-x: auto; overflow-y: auto; max-height: 620px; border: 1px solid var(--border); border-radius: 10px; }
  .pbc-table{ border-collapse: collapse; width: 100%; font-size: 12px; }

  .pbc-columns-row{ position: relative; display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .pbc-columns-panel{
    position: absolute; top: 34px; right: 0; z-index: 5; background: #fff; border: 1px solid var(--border);

  /* Aufgabenzeilen immer innerhalb des sichtbaren Bereichs halten */
  .global-overview,.global-accordion-list,.global-accordion,.global-accordion-body{max-width:100%;min-width:0;overflow-x:hidden}

  /* ===== LUMINA lokaler Datenraum-Explorer ===== */
  .explorer-shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:430px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
  .explorer-tree{background:#fafafb;border-right:1px solid var(--border);padding:14px;overflow:auto;max-height:560px}
  .explorer-tree-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:2px 7px 10px;flex-wrap:wrap}
  .explorer-tree-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);padding:0}
  .explorer-tree-controls{display:flex;gap:4px;flex-wrap:wrap}
  .explorer-tree-control{all:unset;box-sizing:border-box;cursor:pointer;font-size:10px;font-weight:600;color:var(--text-secondary);padding:4px 6px;border-radius:6px}
  .explorer-tree-control:hover{background:#fff;color:var(--text-primary)}
  .explorer-folder{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1.35;color:var(--text-secondary);white-space:normal;overflow:visible;word-break:break-word}
  .explorer-folder:hover{background:#fff;color:var(--text-primary)}
  .explorer-folder.active{background:#fff;color:var(--text-primary);font-weight:650;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .explorer-folder-icon{width:12px;color:var(--text-faint);font-size:11px;flex:0 0 auto;transition:transform .12s ease}.explorer-folder.active .explorer-folder-icon{color:var(--accent)}
  .explorer-folder.is-open>.explorer-folder-icon{transform:rotate(90deg)}
  .explorer-folder-children{display:none}
  .explorer-folder-children.is-open{display:block}
  .explorer-main{padding:18px 20px;min-width:0}
  .explorer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .explorer-breadcrumb{font-size:11.5px;color:var(--text-faint);line-height:1.55}.explorer-breadcrumb strong{color:var(--text-primary);font-size:15px;display:block;margin-top:2px}
  .explorer-toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .explorer-upload{display:none;margin:14px 0;padding:14px;background:#fafafb;border:1px solid var(--border);border-radius:10px}
  .explorer-upload.open{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .explorer-upload .span-2{grid-column:1/-1}.explorer-upload-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
  .explorer-list{margin-top:14px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .explorer-row{display:grid;grid-template-columns:minmax(190px,1.6fr) minmax(105px,.7fr) 90px 115px 84px;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--border);font-size:11.5px}
  .explorer-row:last-child{border-bottom:0}.explorer-row:hover{background:#fafafb}
  .explorer-row.head{background:#fafafb;color:var(--text-secondary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:8px;padding-bottom:8px}
  .explorer-file-name{display:flex;align-items:flex-start;gap:9px;min-width:0}.explorer-file-icon{width:28px;height:28px;border-radius:7px;background:#eef4ff;color:#2463eb;display:grid;place-items:center;flex:0 0 auto;font-size:12px;font-weight:700}
  .explorer-file-text{min-width:0}.explorer-file-title{font-weight:650;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.explorer-file-sub{font-size:10px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .explorer-actions{display:flex;gap:4px;justify-content:flex-end}.explorer-action{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:10.5px;font-weight:650;color:var(--text-secondary)}.explorer-action:hover{background:var(--hover);color:var(--text-primary)}.explorer-action.danger:hover{background:#FBE9E9;color:#b42318;border-color:#f0b5af}
  .explorer-empty{padding:38px 18px;text-align:center;color:var(--text-secondary);font-size:12.5px}.explorer-empty strong{display:block;color:var(--text-primary);font-size:14px;margin-bottom:5px}
  .explorer-assignment{margin-top:14px;padding:11px 13px;border-radius:9px;background:var(--done-bg);color:var(--done-text);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;align-items:center}.explorer-assignment b{font-weight:700}
  @media(max-width:900px){.explorer-shell{grid-template-columns:1fr}.explorer-tree{border-right:0;border-bottom:1px solid var(--border);max-height:200px}.explorer-row{grid-template-columns:minmax(180px,1fr) 90px 84px}.explorer-row>*:nth-child(2),.explorer-row>*:nth-child(4){display:none}.explorer-upload.open{grid-template-columns:1fr}.explorer-upload .span-2,.explorer-upload-actions{grid-column:auto}}

  /* Flexible Datenraumspalten: Inhalte bleiben auch bei schmaler Mittelspalte sichtbar. */
  .task-modal{width:min(1420px,calc(100vw - 32px))}
  .task-modal-body{grid-template-columns:minmax(0,1fr) clamp(260px,22vw,320px)}
  .task-main{min-width:0;overflow-x:hidden}
  .explorer-shell{width:100%;grid-template-columns:clamp(205px,30%,290px) minmax(0,1fr)}
  .explorer-main{container-type:inline-size;overflow:hidden}
  .explorer-head{flex-wrap:wrap}
  .explorer-breadcrumb{min-width:0;flex:1 1 180px;overflow-wrap:anywhere}
  .explorer-toolbar{min-width:0;max-width:100%;flex:1 1 260px}
  .explorer-toolbar .btn-secondary,.explorer-toolbar .btn-save{max-width:100%;white-space:normal;text-align:center;line-height:1.25}
  .explorer-upload.open{grid-template-columns:repeat(2,minmax(0,1fr))}
  .explorer-upload .task-field,.explorer-upload input{min-width:0;width:100%;box-sizing:border-box}
  .explorer-upload-actions{min-width:0;flex-wrap:wrap}
  .explorer-upload-actions .btn-secondary,.explorer-upload-actions .btn-save{max-width:100%;white-space:normal;text-align:center}
  .explorer-list{max-width:100%}
  .explorer-row{grid-template-columns:minmax(145px,2fr) minmax(64px,.65fr) minmax(52px,.45fr) minmax(78px,.7fr) minmax(66px,.55fr)}
  .explorer-row>*{min-width:0;overflow-wrap:anywhere}
  .explorer-assignment{flex-wrap:wrap}
  @container (max-width:620px){
    .explorer-upload.open{grid-template-columns:minmax(0,1fr)}
    .explorer-upload .span-2,.explorer-upload-actions{grid-column:auto}

  }
  @container (max-width:430px){
    .explorer-toolbar{justify-content:stretch}
    .explorer-toolbar .btn-secondary,.explorer-toolbar .btn-save{flex:1 1 100%}
    .explorer-row{grid-template-columns:minmax(0,1fr) 64px}
    .explorer-row>*:nth-child(3){display:none}
  }
  @media(max-width:850px){
    .task-modal{width:calc(100vw - 24px)}
    .task-modal-body{grid-template-columns:minmax(0,1fr)}
    .explorer-shell{grid-template-columns:minmax(0,1fr)}
  }

  body:not(.lumina-authenticated) .page,
  body:not(.lumina-authenticated) .task-modal-backdrop{visibility:hidden;}
  .lumina-auth-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#f7f7f8 0%,#edf7f4 100%);}
  body.lumina-authenticated .lumina-auth-screen{display:none;}
  .lumina-auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:0 24px 70px rgba(13,13,13,.12);}
  .lumina-auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .lumina-auth-brand .brand-icon{width:46px;height:46px;flex:0 0 46px;}
  .lumina-auth-card h2{font-size:24px;margin:0 0 6px;}
  .lumina-auth-card p{color:var(--text-secondary);margin:0;line-height:1.5;}
  .lumina-auth-form{display:grid;gap:16px;margin-top:25px;}
  .lumina-auth-form label{display:grid;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);letter-spacing:.04em;}
  .lumina-auth-form input{width:100%;height:46px;border:1px solid var(--border);border-radius:10px;padding:0 13px;font:inherit;background:#fff;}
  .lumina-auth-form input:focus{outline:2px solid rgba(16,163,127,.2);border-color:var(--accent);}
  .lumina-auth-submit{height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;}
  .lumina-auth-submit:disabled{opacity:.6;cursor:wait;}
  .lumina-auth-error{min-height:20px;color:#b42318;font-size:13px;line-height:1.4;}
  .lumina-session{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--border);}
  .lumina-session-email{font-size:12px;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lumina-sync-state{font-size:12px;color:var(--done-text);white-space:nowrap;}
  @media(max-width:900px){.lumina-session-email{display:none}.lumina-auth-card{padding:26px}.lumina-sync-state{display:none}}

  /* ---------- Vier-Block-Ansicht je Prozessschritt (process_step_guidance) ---------- */
  .guide-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start;max-width:1180px;}
  .guide-col{display:grid;gap:18px;align-content:start;min-width:0;}
  .guide-block{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px;}
  .guide-block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .guide-block-title{font-size:15px;font-weight:700;color:var(--text-primary);}
  .guide-block-hint{font-size:11.5px;color:var(--text-faint);}
  .guide-goal{font-size:13.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 18px;}
  /* Hinweis zur Datenbasis - Farbgebung wie die Hinweis-Bande im Arbeitshilfe-Workbook. */
  .guide-datenbasis{display:grid;grid-template-columns:18px minmax(0,1fr);gap:11px;align-items:start;margin:12px 0 18px;padding:12px 14px;background:#FDF3DF;border:1px solid #E8CE96;border-left:4px solid #C8901A;border-radius:10px;font-size:13px;line-height:1.5;color:#72520F;}
  .guide-datenbasis-icon{font-size:15px;line-height:1.3;color:#B4740B;}
  .guide-datenbasis-label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;}
  .guide-section{margin-top:18px;}
  .guide-section-title{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
  .guide-list{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px;line-height:1.5;color:var(--text-secondary);}
  .guide-list.warn li::marker{color:#b42318;}
  .guide-steps{display:grid;gap:8px;}
  .guide-step{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;padding:9px 11px;border:1px solid var(--border);border-radius:10px;font-size:13px;line-height:1.45;color:var(--text-primary);transition:border-color .15s,background .15s;}
  .guide-step:hover{border-color:#CFCFD4;background:var(--hover);}
  .guide-step:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .guide-step-check{width:20px;height:20px;border-radius:6px;border:1.5px solid #C9C9CE;background:#fff;position:relative;margin-top:1px;}
  .guide-step.is-done .guide-step-check{background:var(--accent);border-color:var(--accent);}
  .guide-step.is-done .guide-step-check::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(40deg);}
  .guide-step.is-done .guide-step-text{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--text-faint);}
  .guide-step-num{font-weight:700;color:var(--text-faint);margin-right:6px;}
  .guide-meta{display:grid;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .guide-meta-row{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:12.5px;line-height:1.45;}
  .guide-meta-row dt{color:var(--text-faint);font-weight:600;}
  .guide-meta-row dd{margin:0;color:var(--text-secondary);}
  .guide-helper{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 4px;}
  .guide-helper-name{font-size:13.5px;font-weight:600;color:var(--text-primary);flex:1 1 220px;}
  .guide-fields{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .guide-field-chip{font-size:11.5px;color:var(--text-secondary);background:#F1F1F3;border-radius:999px;padding:4px 9px;}
  .guide-empty{font-size:12.5px;color:var(--text-faint);line-height:1.5;}
  .guide-status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);}
  .guide-status-row:first-of-type{border-top:0;}
  .guide-status-title{font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.35;}
  .guide-status-docs{font-size:11.5px;color:var(--text-secondary);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .guide-status-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .guide-status-row select{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-primary);}
  .guide-status-row select:focus{outline:1.5px solid var(--accent);outline-offset:-1px;}
  .guide-summary{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .guide-chip{font-size:11.5px;font-weight:600;color:var(--text-secondary);background:#F1F1F3;border-radius:999px;padding:5px 10px;}
  .guide-chip.done{background:var(--done-bg);color:var(--done-text);}
  .guide-chip.warn{background:#FDECEA;color:#b42318;}
  .guide-upload{display:grid;gap:12px;margin-top:14px;}
  .guide-upload label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);}
  .guide-upload input,.guide-upload select{font:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-primary);}
  .guide-upload input:focus,.guide-upload select:focus{outline:1.5px solid var(--accent);outline-offset:-1px;}
  .guide-docs{display:grid;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .guide-doc{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--text-secondary);}
  .guide-doc-name{color:var(--text-primary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .guide-doc-sub{font-size:11px;color:var(--text-faint);}
  .guide-note{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:12px;}

  /* Notizen */

  .guide-comment-author{font-weight:700;color:var(--text-secondary);}
  .guide-comment-doc{background:#f1f5f9;border-radius:5px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .guide-comment-body{font-size:12.5px;color:var(--text-primary);line-height:1.5;white-space:pre-wrap;word-break:break-word;}

  .task-guide-stack .guide-block{padding:18px 20px;}

<body>

<div class="lumina-auth-screen" id="lumina-auth-screen">
  <div class="lumina-auth-card">
    <div class="lumina-auth-brand"><div class="brand-icon"></div><div><h2>LUMINA</h2><p>Abschluss-Cockpit</p></div></div>

      <label>Passwort<input id="lumina-auth-password" type="password" autocomplete="current-password" required></label>
      <div class="lumina-auth-error" id="lumina-auth-error" role="alert"></div>

</div>

<div class="page">

  <div class="header">
    <div class="header-brand">
      <div class="brand-icon"></div>
      <div>
        <h1>Abschluss-Cockpit</h1>
        <p id="header-company-line">Muster GmbH</p>
      </div>
    </div>
    <div class="top-toolbar">
      <button class="btn-secondary btn-day" id="btn-my-day" type="button">Mein Tag</button>
      <button class="btn-secondary btn-inbox" id="btn-inbox" type="button">Eingangskorb <span class="inbox-count" id="inbox-count"></span></button>
      <button class="btn-secondary btn-admin-notify" id="btn-notify-all" type="button">Alle benachrichtigen</button>
      <button class="btn-secondary" id="btn-json-export">JSON Export</button>

<script>
function Sub(text){ return { text, done: false, fields: null, data: {} }; }
function SubForm(text, fields){ return { text, done: false, fields, data: {} }; }
function SubRoles(text, standardRoles){
  return {
    text, done: false, type: "roles",
    data: {
      roles: standardRoles.map(r => ({ role: r, vorname: "", nachname: "", email: "" })),
      hiddenColumns: new Set(), columnsPanelOpen: false, columnWidths: {}
    }
  };
}
function SubTree(text, tree){
  return { text, done: false, type: "tree", data: { tree, expanded: new Set() } };
}
function SubTable(text, opts){
  return { text, done: false, type: "table", data: opts };
}
function SubImport(text, expectedColumns){
  return { text, done: false, type: "import", data: { expectedColumns, imported: null } };
}
function SubMapping(text, columns, rows){
  return { text, done: false, type: "mapping", data: { columns, rows: rows.map(r => [...r]), viewMode: "table", accordionExpanded: new Set(), hiddenColumns: new Set(), columnsPanelOpen: false, columnWidths: {} } };
}
function SubPbc(text, columns, taxonomie, rows){
  return {
    text, done: false, type: "pbc",
    data: {
      columns, taxonomie, rows: rows.map(r => [...r]),
      filters: { search: "", prozessschritt: "", kategorie: "", abteilung: "", liefertermin: "" },
      viewMode: "table", accordionExpanded: new Set(), hiddenColumns: new Set(), columnsPanelOpen: false
    }
  };
}
function SubKontenMapping(text, presetAssignments){
  return {
    text, done: false, type: "kontenmapping",
    data: { search: "", assignments: presetAssignments ? { ...presetAssignments } : {}, hiddenColumns: new Set(), columnsPanelOpen: false, columnWidths: {} }
  };
}
function SubStatement(text){
  return { text, done: false, type: "statement", data: { expanded: new Set() } };
}
function SubMilestones(text){
  return { text, done: false, type: "milestones", data: { milestones: [], hiddenColumns: new Set(), columnsPanelOpen: false } };
}
function Ms(title, subs){ return { title, subitems: subs.map(s => typeof s === "string" ? Sub(s) : s) }; }

const stations = []
let view = { level: "grid" };
/* Subitem-Typen, hinter denen ein eigenes Werkzeug steckt statt einer Maßnahme:
   Stammdaten (über .fields), Rollen, Ordnerstruktur, Anlagenspiegel, SuSa-Import,
   Berichtsstruktur, Maßnahmenliste, Kontenzuordnung, Bilanz/GuV, Zeitplan.
   Diese Kacheln dürfen nie durch den Sprung ins Aufgaben-Modal verdrängt werden -
   die Aufgabe der Station bleibt über "Mein Tag" und die Maßnahmenliste erreichbar,
   das Werkzeug dahinter hätte keinen zweiten Weg. */
const WERKZEUG_SUBITEMS = ["roles","tree","table","import","mapping","pbc","kontenmapping","statement","milestones"];
// Die view.level-Namen entsprechen den Subitem-Typen; Stammdaten laufen über .fields.
function subitemViewLevel(sub){
  if(!sub) return null;
  if(sub.fields) return "form";
  return WERKZEUG_SUBITEMS.includes(sub.type) ? sub.type : null;
}
function measureHatWerkzeug(m){
  return !!(m && (m.subitems || []).some(sub => subitemViewLevel(sub)));
}
// Kurzbezeichnung in der Kachelkennung - dieselben Begriffe wie auf den Teilschritt-Karten.
function werkzeugLabel(sub){
  if(sub.fields) return "Formular";
  return { roles:"Rollen", tree:"Struktur", table:"Tabelle", import:"Import", mapping:"Mapping",
           pbc:"Liste", kontenmapping:"Zuordnung", statement:"Auswertung", milestones:"Zeitplan"
         }[sub.type] || "Werkzeug";
}
// Anleitungen aus public.process_step_guidance, geschlüsselt nach Prozessschritt-Code ("3.12").
// Nur noch für den alten Kachelpfad; der neue adressiert über guidanceByStepId.
const guidanceByCode = new Map();
// Dieselben Anleitungen, geschlüsselt nach process_step_id — Fremdschlüssel statt Titel-Präfix.
const guidanceByStepId = new Map();
// Dokumente ohne Aufgabenbezug, geschlüsselt nach process_step_id (documents.task_id ist null).
const guidanceStepDocsByStep = new Map();
// public.process_steps als Baum. Das ist ab hier die Wirbelsäule der Kachelhierarchie:
// Kinder hängen über parent_id, nicht über eine Zeichenkette im Titel.
const processStepsById = new Map();
const processStepsByParent = new Map();   // parent_id bzw. 'root' -> Kinder nach sort_order
const processStepIdByCode = new Map();
// public.process_step_comments, geschlüsselt nach process_step_id.
const stepCommentsByStep = new Map();
// Abgehakte Anleitungsschritte aus public.process_step_guidance_progress,
// geschlüsselt nach "<process_step_id>|<index>". Ersetzt die frühere Ablage in
// stations[..].guidanceChecks, die nur im Browser lebte.
const guidanceProgress = new Map();
let luminaCurrentUserId = null;

// Kacheln mit hinterlegter Anleitung zählen die Schritte aus was_ist_zu_tun,
// alle übrigen wie bisher ihre Teilschritt-Karten.
// Fortschritt eines Teilbaums. Gezählt werden ausschließlich Blätter, denn nur sie zeigen
// seit der Umstellung auf Navigationsseiten überhaupt eine Anleitung. Anleitungen an
// Aggregatknoten dürfen in der Datenbank stehen bleiben (3.13.1–.3, 3.14, die Stationen
// aus dem Massenseed), aber sie sind unerreichbar — würden sie mitzählen, stünde die
// Elternkachel dauerhaft bei 0/n, ohne dass jemand die Haken setzen könnte.
function guidanceSubtreeProgress(stepId){
  const kinder = processStepChildren(stepId);
  if(kinder.length){
    return kinder.reduce((acc, child) => {
      const teil = guidanceSubtreeProgress(child.id);
      acc.done += teil.done; acc.total += teil.total;
      return acc;
    }, { done: 0, total: 0 });
  }
  const guide = guidanceByStepId.get(String(stepId));
  const steps = guide ? guidanceList(guide.was_ist_zu_tun) : [];
  return { done: guidanceChecksFor(stepId, steps).filter(Boolean).length, total: steps.length };
}

function measureProgress(m){
  const step = processStepForNode(m);
  // Aggregat: Summe der Blätter, nicht die eigene (nicht mehr angezeigte) Anleitung.
  if(step && processStepChildren(step.id).length) return guidanceSubtreeProgress(step.id);
  const steps = guidanceStepList(m);
  if(steps.length){
    const checks = guidanceChecksFor(step ? step.id : null, steps);
    return { done: checks.filter(Boolean).length, total: steps.length };
  }
  // Rückfall für Kacheln, deren Unter-Kacheln noch als State-Subitems vorliegen.
  const guided = m.subitems.filter(s => s.type === "guidance");
  if(guided.length){
    return guided.reduce((acc, sub) => {
      const subStep = processStepForNode(sub);
      const subSteps = guidanceStepList(sub);
      acc.done += guidanceChecksFor(subStep ? subStep.id : null, subSteps).filter(Boolean).length;
      acc.total += subSteps.length;
      return acc;
    }, { done: 0, total: 0 });
  }
  return { done: m.subitems.filter(s => s.done).length, total: m.subitems.length };
}
function measureDone(m){ const p = measureProgress(m); return p.done === p.total; }
function measureSubDone(m){ return measureProgress(m).done; }
function stationDone(s){ return s.measures.filter(measureDone).length; }

function overallTotals(){
  let done = 0, total = 0;
  stations.forEach(s => s.measures.forEach(m => { const p = measureProgress(m); total += p.total; done += p.done; }));
  return { done, total };
}

function renderStatusPill(){
  const { done, total } = overallTotals();
  const pct = Math.round((done / total) * 100);
  const pill = document.getElementById("status-pill");
  pill.className = "status-pill" + (pct === 100 ? " complete" : "");
  pill.innerHTML = `<span class="dot"></span>${done} von ${total} Teilschritten erledigt (${pct}%)`;
}

function renderBreadcrumb(){
  const trail = document.getElementById("breadcrumb-trail");
  const desc = document.getElementById("context-desc");
  trail.innerHTML = "";

  const rootCrumb = document.createElement("span");
  rootCrumb.className = "crumb" + (view.level === "grid" ? " current" : "");
  rootCrumb.textContent = "Jahresabschlussprozess";
  if(view.level !== "grid"){
    rootCrumb.addEventListener("click", () => { view = { level: "grid" }; render(); });
  }
  trail.appendChild(rootCrumb);

  if(view.level === "grid"){
    desc.textContent = "Acht Prozessphasen gemäß Maßnahmenliste, vom Prüfungsauftrag bis zur Veröffentlichung.";
    return;
  }

  const s = stations[view.station];
  trail.appendChild(sepEl());
  const stationCrumb = document.createElement("span");
  stationCrumb.className = "crumb" + (view.level === "measures" ? " current" : "");
  stationCrumb.textContent = s.title;
  if(view.level !== "measures"){
    stationCrumb.addEventListener("click", () => { view = { level: "measures", station: view.station }; render(); });
  }
  trail.appendChild(stationCrumb);

  if(view.level === "measures"){
    desc.textContent = s.description;
    return;
  }

  const m = s.measures[view.measure];
  trail.appendChild(sepEl());
  const measureCrumb = document.createElement("span");
  measureCrumb.className = "crumb" + (view.level === "subitems" ? " current" : "");
  measureCrumb.textContent = m.title;
  if(view.level !== "subitems"){
    measureCrumb.addEventListener("click", () => { view = { level: "subitems", station: view.station, measure: view.measure }; render(); });
  }
  trail.appendChild(measureCrumb);

  if(view.level === "subitems"){
    const guide = guidanceForMeasure(m);
    const kinder = processStepChildren(processStepForNode(m)?.id).length;
    desc.textContent = kinder
      ? `${kinder} Kachel${kinder === 1 ? "" : "n"} — Anleitung und Datenraum liegen jeweils in der Kachel.`
      : guide
      ? "Anleitung, Arbeitshilfe, Status und Upload für diesen Prozessschritt."
      : "Vorgeschlagene Teilschritte — anklicken zum Abhaken.";
    return;
  }

  // Vierte Ebene: die Kette kommt aus process_steps (parent_id), nicht aus Array-Positionen.
  if(view.level === "step"){
    const chain = processStepChain(view.stepId, processStepForNode(m)?.id);
    chain.forEach((step, i) => {
      trail.appendChild(sepEl());
      const crumb = document.createElement("span");
      const isLast = i === chain.length - 1;
      crumb.className = "crumb" + (isLast ? " current" : "");
      crumb.textContent = processStepLabel(step);
      if(!isLast){
        crumb.addEventListener("click", () => {
          view = { level: "step", station: view.station, measure: view.measure, stepId: step.id };
          render();
        });
      }
      trail.appendChild(crumb);
    });
    const offen = processStepChildren(view.stepId).length;
    desc.textContent = offen
      ? `${offen} Kachel${offen === 1 ? "" : "n"} — Anleitung und Datenraum liegen jeweils in der Kachel.`
      : "Anleitung, Arbeitshilfe, Status, Upload, Datenraum und Notizen für diese Maßnahme.";
    return;
  }

  if(view.level === "form" || view.level === "roles" || view.level === "tree" || view.level === "table" || view.level === "import" || view.level === "mapping" || view.level === "pbc" || view.level === "kontenmapping" || view.level === "statement" || view.level === "milestones" || view.level === "guidance"){
    const sub = m.subitems[view.sub];
    trail.appendChild(sepEl());
    const subCrumb = document.createElement("span");
    subCrumb.className = "crumb current";
    subCrumb.textContent = sub.text;
    trail.appendChild(subCrumb);
    desc.textContent = view.level === "roles"
      ? "Verantwortliche mit Kontaktdaten hinterlegen."
      : view.level === "tree"
      ? "Vorgeschlagene, nummerierte Ordnerstruktur — anklicken zum Auf-/Zuklappen."
      : view.level === "table"
      ? "Anlagenspiegel mit Kontrollrechnung."
      : view.level === "import"
      ? "Excel-Datei im TFS-SuSa-Format importieren."
      : view.level === "mapping"
      ? "Berichtsstruktur editierbar — Zellen direkt anklicken, neue Zeilen ergänzen."
      : view.level === "pbc"
      ? "Maßnahmenliste editierbar und filterbar — nach Prozessschritt sortiert."
      : view.level === "kontenmapping"
      ? "Jedes Konto der SuSa einer Position aus der Berichtsstruktur zuordnen."
      : view.level === "statement"
      ? "Bilanz & GuV nach Ausweisstruktur — alle 7 Ebenen aufklappbar."
      : view.level === "milestones"
      ? "Zeitplan der Meilensteine mit Termin, Abteilung und Status."
      : view.level === "guidance"
      ? "Anleitung, Arbeitshilfe, Status und Upload für diesen Prozessschritt."
      : "Stammdaten erfassen und speichern.";
  }
}

function sepEl(){
  const sep = document.createElement("span");
  sep.className = "sep";
  sep.textContent = "/";
  return sep;
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  // Nur die oberste Ebene bekommt das kompakte, quadratische Raster.
  grid.className = "grid" + (view.level === "grid" ? " grid-stations" : "");

  // Aggregat-Ebene (Station oder Kategorie mit Unterkacheln): dieselbe Kacheldarstellung
  // wie das oberste Dashboard - durchnummeriert, gleich groß, Fortschrittsbalken unten.
  // Vorher stand hier ein Streifen mit unterschiedlich hohen Zeilen; jede Ebene sieht
  // jetzt gleich aus, unabhängig davon, wie tief man gerade steckt.
  if(view.level === "step" || view.level === "subitems"){
    const kinder = viewStepChildren();
    if(kinder.length){
      kinder.forEach(child => {
        const p = guidanceSubtreeProgress(child.id);
        const enkel = processStepChildren(child.id).length;
        const complete = p.total > 0 && p.done === p.total;
        const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
        const tile = document.createElement("button");
        tile.className = "tile" + (complete ? " is-complete" : "");
        // Volltext als Tooltip: der Titel wird in der Kachel nach sieben Zeilen gekappt.
        tile.title = `${child.code} · ${child.name}`;
        tile.innerHTML = `
          <span class="tile-num">${complete ? "✓ " : ""}${luminaEsc(child.code)}</span>
          <span class="tile-title">${luminaEsc(child.name)}</span>
          ${tileBottomHtml(pct, p.total ? p.done + "/" + p.total : (enkel ? enkel + " Kacheln" : "–"), child.id)}
        `;
        tile.addEventListener("click", () => openProcessStepNode(child.id));
        grid.appendChild(tile);
      });

      // Trägt die Station zusätzlich ein Werkzeug-Subitem, steht dessen Kachel neben den
      // Maßnahmen - betrifft 3.5 (Anlagenspiegel) seit Welle 2 dort Kinder angelegt hat.
      // Nur auf der Stationsseite selbst, nicht auf den Kategorieseiten darunter.
      if(view.level === "subitems"){
        const m = stations[view.station]?.measures?.[view.measure];
        (m?.subitems || []).forEach((sub, k) => {
          const ziel = subitemViewLevel(sub);
          if(!ziel) return;
          const tile = document.createElement("button");
          tile.className = "tile" + (sub.done ? " is-complete" : "");
          tile.title = sub.text;
          tile.innerHTML = `
            <span class="tile-num">${luminaEsc(werkzeugLabel(sub))}</span>
            <span class="tile-title">${luminaEsc(sub.text)}</span>
            <div class="tile-bottom"><div class="tile-meta"><span class="tile-frac">Werkzeug</span></div></div>
          `;
          tile.addEventListener("click", () => {
            view = { level: ziel, station: view.station, measure: view.measure, sub: k };
            render();
          });
          grid.appendChild(tile);
        });
      }
      return;
    }
  }

  if(view.level === "grid"){
    stations.forEach((s, i) => {
      const d = stationDone(s);
      const complete = d === s.measures.length;
      const pct = Math.round((d / s.measures.length) * 100);
      const tile = document.createElement("button");
      tile.className = "tile" + (complete ? " is-complete" : "");
      tile.title = s.title;
      const stationStep = processStepForNode(s);
      tile.innerHTML = `
        <span class="tile-num">${complete ? "✓" : String(i+1).padStart(2,"0")}</span>
        <span class="tile-title">${luminaEsc(s.title)}</span>
        ${tileBottomHtml(pct, `${d}/${s.measures.length}`, stationStep ? stationStep.id : null)}
      `;
      tile.addEventListener("click", () => { view = { level: "measures", station: i }; render(); });
      grid.appendChild(tile);
    });
  }

  if(view.level === "measures"){
    const s = stations[view.station];
    s.measures.forEach((m, j) => {
      const { done: d, total: mTotal } = measureProgress(m);
      const complete = d === mTotal;
      const pct = mTotal ? Math.round((d / mTotal) * 100) : 0;
      const tile = document.createElement("button");
      tile.className = "tile" + (complete ? " is-complete" : "");
      tile.title = m.title;
      // Der Stationstitel trägt den Code bereits ("3.13. Vorbereitung ..."), deshalb
      // steht er hier nur einmal - in der Kennung, nicht doppelt im Titel.
      const mStep = processStepForNode(m);
      const mCode = mStep ? mStep.code : guidanceStepCode(m.title);
      const mName = String(m.title).replace(/^\s*\d+(?:\.\d+)*\.?\s*/, "") || m.title;
      tile.innerHTML = `
        <span class="tile-num">${complete ? "✓ " : ""}${luminaEsc(mCode || String(j+1).padStart(2,"0"))}</span>
        <span class="tile-title">${luminaEsc(mName)}</span>
        ${tileBottomHtml(pct, `${d}/${mTotal}`, mStep ? mStep.id : null)}
      `;
      tile.addEventListener("click", () => {
        const statementIdx = m.subitems.findIndex(x => x.type === "statement");
        if(statementIdx !== -1){
          view = { level: "statement", station: view.station, measure: j, sub: statementIdx };
          render();
          return;
        }
        // Stationen mit Werkzeug-Subitems behalten ihre Werkzeugkacheln: Stammdaten (2.0),
        // Zeitplan (2.1), Rollen (2.2), Maßnahmenliste (2.4), Anlagenspiegel (3.5),
        // SuSa-Import und Kontenzuordnung (3.17). Ohne diese Ausnahme sprang der Klick ins
        // Aufgaben-Modal und das Werkzeug dahinter hatte keinen Weg mehr - die Aufgabe
        // dieser Stationen bleibt über "Mein Tag" erreichbar, das Werkzeug nicht.
        if(measureHatWerkzeug(m)){
          view = { level: "subitems", station: view.station, measure: j };
          render();
          return;
        }
        // Station ohne Unterkacheln, aber mit eigener Aufgabe: sie IST die Maßnahme und
        // öffnet direkt das Aufgaben-Modal. Das betrifft die rund 55 Stationen aus den
        // Kapiteln 1, 2 und 4 bis 8 sowie 3.7 und 3.10 - ohne diese Verzweigung landeten
        // sie weiterhin auf der alten Seitenansicht.
        const step = processStepForNode(m);
        if(step && !processStepChildren(step.id).length && taskRiForStep(step.id) !== null){
          view = { level: "subitems", station: view.station, measure: j };
          openTaskModalForStep(step.id);
          return;
        }
        view = { level: "subitems", station: view.station, measure: j };
        render();
      });
      grid.appendChild(tile);
    });
  }

  if(view.level === "subitems"){
    const m = stations[view.station].measures[view.measure];
    m.subitems.forEach((sub, k) => {
      const tile = document.createElement("button");
      tile.className = "tile tile-leaf" + (sub.done ? " is-complete" : "");
      tile.innerHTML = sub.fields
        ? `<span class="tile-form-badge">Formular</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "roles"
        ? `<span class="tile-form-badge">Rollen</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "tree"
        ? `<span class="tile-form-badge">Struktur</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "table"
        ? `<span class="tile-form-badge">Tabelle</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "import"
        ? `<span class="tile-form-badge">Import</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "mapping"
        ? `<span class="tile-form-badge">Mapping</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "pbc"
        ? `<span class="tile-form-badge">Liste</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "kontenmapping"
        ? `<span class="tile-form-badge">Zuordnung</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "statement"
        ? `<span class="tile-form-badge">Auswertung</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "milestones"
        ? `<span class="tile-form-badge">Zeitplan</span><span class="tile-title">${sub.text}</span>`
        : sub.type === "guidance"
        ? `<span class="tile-form-badge">Anleitung</span><span class="tile-title">${sub.text}</span>`
        : `<span class="tile-check"></span><span class="tile-title">${sub.text}</span>`;
      tile.addEventListener("click", () => {
        if(sub.fields){

function anyRootLevelOpen(rootKeys, expandedSet){
  return rootKeys.some(k => expandedSet.has(k));
}

function treeLabel(path){
  const top = String(path[0]).padStart(2, "0");
  if(path.length === 1) return top;
  return top + "." + path.slice(1).map(i => i + 1).join(".");
}

function treeNodeAt(tree, path){
  let node = tree[path[0]];
  for(let i=1;i<path.length;i++){
    if(typeof node === "string" || !node || !Array.isArray(node.children)) return null;
    node = node.children[path[i]];
  }
  return node;
}

function treeParentArray(tree, path){
  if(path.length === 1) return tree;
  const parent = treeNodeAt(tree, path.slice(0,-1));
  return parent && typeof parent !== "string" && Array.isArray(parent.children) ? parent.children : null;
}

function setTreeNodeName(tree, path, newName){
  const arr = treeParentArray(tree,path);
  if(!arr) return false;
  const idx=path[path.length-1], old=arr[idx];
  if(typeof old === "string") arr[idx]=newName;
  else old.name=newName;
  return true;
}

function ensureTreeObject(tree,path){
  const arr=treeParentArray(tree,path);
  if(!arr) return null;
  const idx=path[path.length-1];
  if(typeof arr[idx] === "string") arr[idx]={name:arr[idx],children:[]};
  if(!Array.isArray(arr[idx].children)) arr[idx].children=[];
  return arr[idx];
}

function addUniqueTreeChildren(sub,rootName,names){
  if(!sub?.data?.tree) return;
  const root=sub.data.tree.find(x=>typeof x!=="string" && x.name===rootName);
  if(!root) return;
  if(!Array.isArray(root.children)) root.children=[];
  const existing=new Set(root.children.map(x=>typeof x==="string"?x:x.name));
  names.forEach(name=>{if(!existing.has(name)) root.children.push(name);});
}

function ensureAdditionalProjectFolders(sub){
  if(!sub?.data || sub.data.folderEditorMigrationV1) return;
  addUniqueTreeChildren(sub,"Projektsteuerung",["Maßnahmenliste & Status","Projektkommunikation"]);
  addUniqueTreeChildren(sub,"Stammdaten & Grundlagen",["Organisation & Organigramme","Geschäftsführung & Gremien","Richtlinien & Vollmachten","Wesentliche Verträge","IT-Systeme & Berechtigungen"]);
  sub.data.folderEditorMigrationV1=true;
  scheduleLuminaSave();
}

function treePromptName(title,current=""){
  const value=prompt(title,current);
  if(value===null) return null;
  const cleaned=value.trim().replace(/[\\/:*?"<>|]/g,"-");
  if(!cleaned){alert("Bitte einen Ordnernamen eingeben.");return null;}
  return cleaned;
}

function renderTreeNode(node, path, depth, container, expandedSet){
  const isLeaf = typeof node === "string";
  const name = isLeaf ? node : node.name;
  const children = isLeaf ? null : node.children;
  const hasChildren = !!(children && children.length);
  const key = path.join("-");
  const isOpen = expandedSet.has(key);

  const row = document.createElement("div");
  row.className = "tree-row" + (hasChildren ? " has-children" : "") + (isOpen ? " is-open" : "");
  row.dataset.depth = depth;
  row.style.paddingLeft = (depth * 20) + "px";
  row.innerHTML = `
    <span class="tree-chevron${hasChildren ? "" : " spacer"}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </span>
    <span class="tree-num">${treeLabel(path)}</span>
    <span class="tree-name">${luminaEsc(name)}</span>
    <span class="tree-actions">
      <button class="tree-action add" title="Unterordner hinzufügen" aria-label="Unterordner hinzufügen">＋</button>
      <button class="tree-action rename" title="Ordner umbenennen" aria-label="Ordner umbenennen">✎</button>
      <button class="tree-action danger delete" title="Ordner löschen" aria-label="Ordner löschen">×</button>
    </span>
  `;
  container.appendChild(row);

  const stop=e=>{e.preventDefault();e.stopPropagation();};
  row.querySelector('.tree-action.add').addEventListener('click',e=>{
    stop(e);
    const newName=treePromptName("Name des neuen Unterordners:");
    if(!newName)return;
    const obj=ensureTreeObject(stations[view.station].measures[view.measure].subitems[view.sub].data.tree,path);
    obj.children.push(newName);
    expandedSet.add(key);
    scheduleLuminaSave(); renderTree();
  });
  row.querySelector('.tree-action.rename').addEventListener('click',e=>{
    stop(e);
    const newName=treePromptName("Ordner umbenennen:",name);
    if(!newName || newName===name)return;
    setTreeNodeName(stations[view.station].measures[view.measure].subitems[view.sub].data.tree,path,newName);
    scheduleLuminaSave(); renderTree();
  });
  row.querySelector('.tree-action.delete').addEventListener('click',e=>{
    stop(e);
    const msg=hasChildren?`„${name}“ einschließlich aller Unterordner löschen?`:`Ordner „${name}“ löschen?`;
    if(!confirm(msg))return;
    const tree=stations[view.station].measures[view.measure].subitems[view.sub].data.tree;
    const arr=treeParentArray(tree,path);
    if(arr) arr.splice(path[path.length-1],1);
    scheduleLuminaSave(); renderTree();
  });

  let childWrap = null;
  if(hasChildren){
    childWrap = document.createElement("div");
    childWrap.className = "tree-children" + (isOpen ? " is-open" : "");
    children.forEach((child, i) => renderTreeNode(child, [...path, i], depth + 1, childWrap, expandedSet));
    container.appendChild(childWrap);

    row.addEventListener("click", (e) => {
      if(e.target.closest('.tree-actions')) return;
      if(expandedSet.has(key)) expandedSet.delete(key); else expandedSet.add(key);
      renderTree();
    });
  }
}

function renderTree(){
  const sub = stations[view.station].measures[view.measure].subitems[view.sub];
  ensureAdditionalProjectFolders(sub);
  const container = document.getElementById("form-container");
  const rootKeys = sub.data.tree.map((_, i) => String(i));
  const isOpenState = anyRootLevelOpen(rootKeys, sub.data.expanded);
  container.innerHTML = `
    <div class="tree-card">
      <div class="tree-toolbar">
        <span class="tree-editor-note">Ordner direkt hier ergänzen, umbenennen oder löschen.</span>
        <button class="tree-add-root" id="tree-add-root">＋ Hauptordner</button>
        <button class="tree-toggle-all" id="tree-toggle-all">${isOpenState ? "Alle zuklappen" : "Alle aufklappen"}</button>
      </div>
      <div id="tree-list"></div>
      <div class="form-actions" style="margin-top:20px;">
        <button class="btn-save" id="btn-save-tree">Struktur übernehmen</button>
        <button class="btn-secondary" id="btn-export-disk">Ordner direkt anlegen</button>
        <button class="btn-secondary" id="btn-export-zip">Saubere ZIP erstellen</button>
        <span class="form-saved-note" id="tree-saved-note" style="display:${sub.done ? "" : "none"};">Übernommen ✓</span>
      </div>
      <div class="form-saved-note" id="export-status-note" style="display:none; margin-top:10px;"></div>
    </div>
  `;
  const list = document.getElementById("tree-list");
  sub.data.tree.forEach((node, i) => renderTreeNode(node, [i], 0, list, sub.data.expanded));

  document.getElementById("tree-add-root").addEventListener("click",()=>{
    const name=treePromptName("Name des neuen Hauptordners:");
    if(!name)return;
    sub.data.tree.push({name,children:[]});
    scheduleLuminaSave(); renderTree();
  });

  document.getElementById("tree-toggle-all").addEventListener("click", () => {
    const allOpen = isOpenState;
    if(allOpen){
      sub.data.expanded.clear();
    } else {
      const collectKeys = (node, path) => {
        const isLeaf = typeof node === "string";
        if(isLeaf) return;
        sub.data.expanded.add(path.join("-"));
        node.children.forEach((c, i) => collectKeys(c, [...path, i]));
      };
      sub.data.tree.forEach((node, i) => collectKeys(node, [i]));
    }
    renderTree();
  });

  document.getElementById("btn-save-tree").addEventListener("click", () => {
    sub.done = true;
    scheduleLuminaSave();
    render();
  });

  document.getElementById("btn-export-zip").addEventListener("click", () => {
    exportTreeAsZip(sub);
  });
  document.getElementById("btn-export-disk").addEventListener("click", () => {
    exportTreeToDisk(sub);
  });
}

function parseWorkbookFile(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const sheetName = wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      callback(null, { sheetName, rows });
    } catch(err){
      callback(err, null);
    }
  };
  reader.onerror = () => callback(new Error("Datei konnte nicht gelesen werden"), null);
  reader.readAsArrayBuffer(file);
}

function buildMappingTree(rows){
  const root = { label: null, children: {}, rowIndices: [] };
  rows.forEach((row, idx) => {
    const path = row.slice(0, 7).map(v => (v || "").toString().trim()).filter(v => v && v !== "(Leer)");
    let node = root;
    path.forEach(label => {
      if(!node.children[label]) node.children[label] = { label, children: {}, rowIndices: [] };
      node = node.children[label];
    });
    node.rowIndices.push(idx);
  });
  return root;
}

function renderMappingTreeNode(node, path, depth, container, expandedSet, rows){
  const childLabels = Object.keys(node.children);

  if(depth === 0){
    childLabels.forEach(label => renderMappingTreeNode(node.children[label], [...path, label], depth + 1, container, expandedSet, rows));
    return;
  }

  const key = path.join("|||");
  const isOpen = expandedSet.has(key);
  const hasChildren = childLabels.length > 0;

  const row = document.createElement("div");
  row.className = "tree-row" + (hasChildren ? " has-children" : "") + (isOpen ? " is-open" : "");
  row.style.paddingLeft = ((depth - 1) * 20) + "px";
  const zielschluessel = node.rowIndices.map(i => rows[i][7]).filter(v => v && v !== "(Leer)");
  row.innerHTML = `
    <span class="tree-chevron${hasChildren ? "" : " spacer"}">${pbcChevronSvg()}</span>
    <span class="tree-name">${node.label}</span>
    ${zielschluessel.length ? `<span class="mapping-leaf-tag">${zielschluessel.join(", ")}</span>` : ""}
  `;
  container.appendChild(row);

  const childWrap = document.createElement("div");
  childWrap.className = "tree-children" + (isOpen ? " is-open" : "");
  container.appendChild(childWrap);

  if(hasChildren){
    row.addEventListener("click", () => {
      if(expandedSet.has(key)) expandedSet.delete(key); else expandedSet.add(key);
      renderMapping();
    });
    if(isOpen){
      childLabels.forEach(label => renderMappingTreeNode(node.children[label], [...path, label], depth + 1, childWrap, expandedSet, rows));
    }
  }
}

const PBC_LIEFERTERMINE = ["Vor der Vorprüfung", "Vorprüfung", "Vor der Hauptprüfung", "Hauptprüfung"];

function pbcDistinct(rows, idx){
  const set = new Set();
  rows.forEach(r => { if(r[idx]) set.add(r[idx]); });
  return [...set].sort();
}

function taskMatchesDashboardFilter(row, ri, sub, filter){
  if(!filter) return true;
  const st = ensureTaskState(sub.data, row, ri);
  if(filter === "open") return st.workStatus === "Offen" || st.workStatus === "Angenommen";
  if(filter === "wip") return st.workStatus === "In Bearbeitung";
  if(filter === "submitted") return st.workStatus === "Eingereicht";
  if(filter === "review") return st.workStatus === "Eingereicht" && st.reviewStatus !== "Akzeptiert";
  if(filter === "overdue") return taskTiming(row, st) === "Überfällig";
  if(filter === "done") return st.workStatus === "Abgeschlossen" || st.workStatus === "Nicht relevant";
  return true;
}

function pbcFilteredIndices(sub){
  const f = sub.data.filters;
  const search = String(f.search || "").trim().toLowerCase();
  const lfdNr = String(f.lfdNr || "").trim().toLowerCase();
  const out = [];
  sub.data.rows.forEach((r, i) => {
    if(f.prozessschritt && r[1] !== f.prozessschritt) return;
    if(f.kategorie && r[2] !== f.kategorie) return;
    if(f.abteilung && r[4] !== f.abteilung) return;
    if(f.liefertermin && r[8] !== f.liefertermin) return;
    if(lfdNr && String(r[0] || "").trim().toLowerCase() !== lfdNr) return;
    if(f.taskStatus && !taskMatchesDashboardFilter(r, i, sub, f.taskStatus)) return;
    if(search && !r.slice(0,12).join(" ").toLowerCase().includes(search)) return;
    out.push(i);
  });
  return out;
}

function pbcSortKeyRow(row){
  const m = /^(\d+)\.(\d+)/.exec(row[1] || "");
  const major = m ? parseInt(m[1], 10) : 9999;
  const minor = m ? parseInt(m[2], 10) : 9999;
  const lfd = parseInt(row[0], 10);
  return [major, minor, isNaN(lfd) ? 999999 : lfd];
}

function pbcSortRows(rows){
  rows.sort((a, b) => {
    const ka = pbcSortKeyRow(a), kb = pbcSortKeyRow(b);
    for(let i = 0; i < 3; i++){ if(ka[i] !== kb[i]) return ka[i] - kb[i]; }
    return 0;
  });
}

  document.getElementById("btn-pbc-export").addEventListener("click", () => {
    const { gesellschaft, jahr } = getStammdaten();
    const exportColumns = [...d.columns.slice(0, 9), "T (Tage)", "Datum (manuell)", "Datum (aktuell, nicht importierbar)", "Wochentag", d.columns[9]];
    const aoa = [exportColumns, ...d.rows.map(r => {
      const eff = computeRowEffectiveDatum(r);
      return [
        ...r.slice(0, 9),
        r[11] || "",
        r[10] ? formatDateDE(r[10]) : "",
        eff ? formatDateDE(eff) : "",
        eff ? weekdayDE(eff) : "",
        r[9] || ""
      ];
    })];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, "Massnahmenliste");
    XLSX.writeFile(wb, sanitizeFileName(`Massnahmenliste ${jahr} ${gesellschaft}`) + ".xlsx");
    const note = document.getElementById("pbc-status-note");
    note.textContent = "Excel-Export gestartet.";
    note.style.display = "";
  });

  document.getElementById("btn-pbc-import").addEventListener("click", () => {
    document.getElementById("pbc-import-input").click();
  });

  document.getElementById("pbc-import-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const note = document.getElementById("pbc-status-note");
    parseWorkbookFile(file, (err, result) => {
      if(err){
        note.textContent = "Datei konnte nicht gelesen werden: " + err.message;
        note.style.display = "";
        return;
      }
      const rawRows = result.rows.filter(rr => rr.some(c => c !== ""));
      const header = rawRows[0] || [];
      const isNewFormat = header.some(h => String(h).trim() === "T (Tage)");
      const kommentarIdx = header.findIndex(h => String(h).trim() === d.columns[9]);
      const dataRows = rawRows.slice(1);
      let overridesKept = 0, overridesSkipped = 0;
      d.rows = dataRows.map(rr => {
        const base = rr.slice(0, 9).map(c => c === undefined ? "" : String(c));
        while(base.length < 9) base.push("");
        if(!isNewFormat){
          const kommentar = rr[9] !== undefined ? String(rr[9]) : "";
          return [...base, kommentar, "", ""];
        }
        const tRaw = rr[9];
        const datumRaw = rr[10];
        const kommentar = kommentarIdx >= 0 && rr[kommentarIdx] !== undefined ? String(rr[kommentarIdx]) : "";
        const row = [...base, kommentar, "", ""];
        if(tRaw !== undefined && tRaw !== ""){
          row[11] = String(tRaw);
        } else if(datumRaw){
          const iso = parseDateAnyToISO(datumRaw);
          if(iso){
            const wouldBeFromLink = computeRowEffectiveDatum(row);
            if(wouldBeFromLink !== iso){
              row[10] = iso;
              overridesKept++;
            } else {
              overridesSkipped++;
            }
          }
        }
        return row;
      });
      renderPbc();
      const note2 = document.getElementById("pbc-status-note");
      note2.textContent = `Import abgeschlossen: ${d.rows.length} Maßnahmen übernommen (bestehende Liste wurde ersetzt). ${overridesKept} echte manuelle Termine übernommen, ${overridesSkipped} folgen wieder sauber der Meilenstein-Verknüpfung.`;
      note2.style.display = "";
    });
    e.target.value = "";
  });

  if(d.viewMode === "accordion"){
    renderPbcAccordion(sub, visible, groupKeysInOrder);
  } else {
    renderPbcTable(sub, visible);
  }
}

function pbcMajorNum(label){
  const m = /^(\d+)\./.exec(label);
  return m ? m[1] : "?";
}

function pbcMajorRootKeys(groupKeysInOrder){
  const majors = [...new Set(groupKeysInOrder.map(pbcMajorNum))];
  return majors.map(m => "MAJOR::" + m);
}

function pbcMajorTitle(majorNum, sub){
  const entry = sub.data.taxonomie.find(t => new RegExp("^" + majorNum + "\\.0\\.").test(t));
  if(!entry) return "";
  const m = entry.match(/^\d+\.0\.\s*(.*)$/);
  let title = m ? m[1] : "";
  title = title.replace(/\s*allg(e)?mein\s*$/i, "").trim();
  return title;
}

function pbcChevronSvg(){
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>`;
}

function renderPbcAccordion(sub, visible, groupKeysInOrder){
  const d = sub.data;
  const content = document.getElementById("pbc-content");
  const wrap = document.createElement("div");
  wrap.className = "pbc-accordion-wrap";
  content.appendChild(wrap);

  const byGroup = {};
  visible.forEach(i => {
    const key = d.rows[i][1] || "(ohne Prozessschritt)";
    if(!byGroup[key]) byGroup[key] = [];
    byGroup[key].push(i);
  });

  const majorOrder = [];
  const majorMap = {};
  groupKeysInOrder.forEach(key => {
    const major = pbcMajorNum(key);
    if(!majorMap[major]){ majorMap[major] = []; majorOrder.push(major); }
    majorMap[major].push(key);
  });
  majorOrder.sort((a, b) => (parseInt(a) || 999) - (parseInt(b) || 999));

  majorOrder.forEach(major => {
    const majorKey = "MAJOR::" + major;
    const subKeys = majorMap[major];
    const totalCount = subKeys.reduce((a, k) => a + (byGroup[k] ? byGroup[k].length : 0), 0);
    const isMajorOpen = d.accordionExpanded.has(majorKey);
    const title = pbcMajorTitle(major, sub);

    const majorRow = document.createElement("div");
    majorRow.className = "pbc-group-row pbc-group-major tree-row" + (isMajorOpen ? " is-open" : "");
    majorRow.innerHTML = `
      <span class="tree-chevron">${pbcChevronSvg()}</span>
      <span class="tree-name">${major}.${title ? " " + title : ""}</span>
      <span class="pbc-group-count">${totalCount}</span>
    `;
    majorRow.addEventListener("click", () => {
      if(d.accordionExpanded.has(majorKey)) d.accordionExpanded.delete(majorKey); else d.accordionExpanded.add(majorKey);
      renderPbc();
    });
    wrap.appendChild(majorRow);

    if(!isMajorOpen) return;

    const subWrap = document.createElement("div");
    subWrap.className = "pbc-major-children";
    wrap.appendChild(subWrap);

    subKeys.forEach(key => {
      const indices = byGroup[key] || [];
      const isOpen = d.accordionExpanded.has(key);
      const groupRow = document.createElement("div");
      groupRow.className = "pbc-group-row tree-row" + (isOpen ? " is-open" : "");
      groupRow.innerHTML = `
        <span class="tree-chevron">${pbcChevronSvg()}</span>
        <span class="tree-name">${key}</span>
        <span class="pbc-group-count">${indices.length}</span>
      `;
      groupRow.addEventListener("click", () => {
        if(d.accordionExpanded.has(key)) d.accordionExpanded.delete(key); else d.accordionExpanded.add(key);
        renderPbc();
      });
      subWrap.appendChild(groupRow);

      if(!isOpen) return;

      indices.forEach(i => {
        const row = d.rows[i];
        const card = document.createElement("div");
        card.className = "pbc-item-card";
        card.innerHTML = `
          <div class="pbc-item-head">
            <span class="pbc-item-lfd">Nr. ${row[0] || ""}</span>
            <span class="pbc-item-badge">${row[2] || ""}</span>
            ${row[8] ? `<span class="pbc-item-badge lief">${row[8]}${computeRowEffectiveDatum(row) ? " · " + formatDateDE(computeRowEffectiveDatum(row)) + (weekdayDE(computeRowEffectiveDatum(row)) ? " (" + weekdayDE(computeRowEffectiveDatum(row)) + ")" : "") : ""}</span>` : ""}
          </div>
          <div class="pbc-item-title">${row[3] || ""}</div>
          <div class="pbc-item-meta">${row[4] || ""}${resolveRoleName(row[4]) ? " (" + resolveRoleName(row[4]) + ")" : ""}${row[6] ? " · " + row[6] : ""}${row[7] ? " · " + row[7] : ""}</div>
          <div class="pbc-item-body">${(row[5] || "").replace(/</g, "&lt;")}</div>
          ${row[9] ? `<div class="pbc-item-comment">${row[9]}</div>` : ""}
        `;
        subWrap.appendChild(card);
      });
    });
  });
}

    { key: "prozess", label: "Prozessschritt", colClass: "col-prozess", cell: (row, ri) => pbcCellProzess(sub, row, ri) },
