   Status und Datei-Upload. Ohne Datensatz bleibt die bisherige Kachelansicht bestehen. */

// "3.12. Vorbereitung Rückstellungen" -> "3.12"
function guidanceStepCode(title){ const match=String(title||'').trim().match(/^(\d+(?:\.\d+)+)/); return match?match[1]:''; }
function guidanceList(value){ return Array.isArray(value)?value.filter(item=>String(item||'').trim()):[]; }
// Zweite Ebene (Maßnahme) trägt den Titel in .title, dritte Ebene (Unter-Kachel wie 3.14.1) in .text.
function guidanceNodeTitle(node){ return node?(node.title||node.text||''):''; }
function guidanceForMeasure(m){ return m?guidanceByCode.get(guidanceStepCode(guidanceNodeTitle(m)))||null:null; }
// Anleitung eines Knotens: erst über den Fremdschlüssel, dann über den Code im Titel.
function guidanceRecordFor(node){
  const step=processStepForNode(node);
  return (step&&guidanceByStepId.get(step.id))||guidanceForMeasure(node);
}
function guidanceStepList(m){ const guide=guidanceRecordFor(m); return guide?guidanceList(guide.was_ist_zu_tun):[]; }
function guidanceCurrentMeasure(){
  const measure=stations[view.station]?.measures?.[view.measure]||null;
  if(view.level==='guidance') return measure?.subitems?.[view.sub]||null;
  return view.level==='subitems'?measure:null;
}
function guidanceForView(){ return guidanceForMeasure(guidanceCurrentMeasure()); }
// Kinder der gerade geöffneten Kachel. Sind welche da, ist die Ebene ein Aggregat.
function viewStepChildren(){
  const ctx=guidanceContext();
  return ctx?processStepChildren(ctx.stepId):[];
}
/* Frühester offener Termin im Teilbaum einer Kachel.
   Damit steht auf der Kachel, was als Nächstes fällig ist, ohne sie zu öffnen - vorher
   war der Liefertermin nur klein im Status-Panel des Modals zu sehen.
   Quelle ist bewusst die Maßnahmenliste (taskEffectiveDate), nicht
   process_step_due_dates: diese Tabelle wird vom Frontend nicht gelesen. */
function stepDueSummary(stepId){
  const pbc=luminaPbcRows();
  if(!pbc||!stepId) return null;
  const ids=new Set(processStepSubtreeIds(stepId));
  let frueh=null,zustand='';
  pbc.rows.forEach((row,ri)=>{
    const st=ensureTaskState(pbc.sub.data,row,ri);
    if(!ids.has(String(st.remoteProcessStepId||''))) return;
    if(['Abgeschlossen','Nicht relevant'].includes(st.workStatus)) return;
    const iso=taskEffectiveDate(row);
    if(!iso) return;
    if(!frueh||iso<frueh){ frueh=iso; zustand=taskTiming(row,st); }
  });
  return frueh?{iso:frueh,zustand}:null;
}
// Kachelfuß: Fortschrittsbalken, Zähler und Fälligkeit - für alle drei Kachelraster gleich.
function tileBottomHtml(pct,frac,stepId){
  const due=stepDueSummary(stepId);
  const klasse=due?(due.zustand==='Überfällig'?' is-overdue':(due.zustand==='Heute fällig'||due.zustand==='Bald fällig')?' is-soon':''):'';
  return `<div class="tile-bottom">
    <div class="tile-bar-track"><div class="tile-bar-fill" style="width:${pct}%"></div></div>
    <div class="tile-meta">
      <span class="tile-frac">${luminaEsc(frac)}</span>
      ${due?`<span class="tile-due${klasse}" title="${luminaEsc(due.zustand)}">${luminaEsc(formatDateDE(due.iso))}</span>`:''}
    </div>
  </div>`;
}
// Eine Stelle für den Sprung in einen Prozessschritt, egal von welcher Ebene aus:
// Aggregat öffnet die Kachelübersicht, Maßnahme das Aufgaben-Modal.
function openProcessStepNode(stepId){
  if(processStepChildren(stepId).length){
    view={level:'step',station:view.station,measure:view.measure,stepId};
    render();
    return;
  }
  openTaskModalForStep(stepId);
}
// Die Vier-Block-Ansicht greift, sobald es eine Anleitung ODER Unterkacheln gibt.
// Der zweite Fall ist der neue Pfad: eine Kachel mit Kindern in process_steps.
function guidanceViewActive(){
  const ctx=guidanceContext();
  return !!ctx&&(!!ctx.guide||processStepChildren(ctx.stepId).length>0);
}
function guidanceStepDocuments(stepId){ return stepId?(guidanceStepDocsByStep.get(String(stepId))||[]):[]; }

/* Überschrift einer Aufgabe.
   tasks.title trägt nur die Kategorie aus der PBC-Liste ("Allgemein", "Anlagevermögen",
   "Bestätigungen Dritter") und wiederholt sich dadurch über viele Zeilen - als Titel in
   einer Aufgabenliste sagt sie nichts. Ist die Aufgabe bereits an einen Blattknoten
   umgehängt, benennt process_steps.name genau diese eine Maßnahme; das ist derselbe Text,
   der als Kacheltitel und im Modal-Kopf steht.
   Reiner Anzeigefix - er greift automatisch für jede weitere Rollout-Welle, ohne dass
   hier nochmals etwas angefasst werden muss. */
function taskDisplayTitle(row,st){
  const step=st&&st.remoteProcessStepId?processStepById(st.remoteProcessStepId):null;
  if(step&&!processStepChildren(step.id).length&&String(step.name||'').trim()) return step.name;
  return row[3]||row[1]||'Maßnahme';
}
function guidanceTasks(code){
  const pbc=luminaPbcRows();
  if(!pbc||!code) return [];
  return pbc.rows.map((row,ri)=>({row,ri,sub:pbc.sub,state:ensureTaskState(pbc.sub.data,row,ri)}))
    .filter(entry=>guidanceStepCode(entry.row[1])===code);
}

/* ---------- Kachelhierarchie aus process_steps ----------
   Die Weiche zwischen altem und neuem Pfad ist bewusst kein Merker, sondern eine
   Eigenschaft der Daten: eine Kachel rendert aus process_steps, sobald sie dort
   Kinder hat. Damit kann nichts auseinanderlaufen - geprüft wird genau das, was
   gerendert werden soll. Beim Ausrollen auf weitere Stationen kippt jede Kachel
   von selbst um, sobald ihre Kinder angelegt sind. */
function processStepChildren(stepId){ return stepId?(processStepsByParent.get(String(stepId))||[]):[]; }
function processStepById(stepId){ return stepId?(processStepsById.get(String(stepId))||null):null; }
function processStepForNode(node){
  const code=guidanceStepCode(guidanceNodeTitle(node));
  return code?processStepById(processStepIdByCode.get(code)):null;
}
function processStepLabel(step){ return step?`${step.code} ${step.name}`.trim():''; }
// Kette vom Knoten aufwaerts bis unterhalb von stopAtId (exklusive), in Anzeigereihenfolge.
function processStepChain(stepId,stopAtId){
  const chain=[]; let current=processStepById(stepId);
  while(current&&String(current.id)!==String(stopAtId||'')){
    chain.unshift(current);
    current=current.parentId?processStepById(current.parentId):null;
  }
  return chain;
}
function processStepSubtreeIds(stepId){
  const out=[]; const walk=id=>{ out.push(String(id)); processStepChildren(id).forEach(child=>walk(child.id)); };
  if(stepId) walk(String(stepId));
  return out;
}
// Einheitlicher Bezugspunkt der Kachelansicht - egal ob State-Knoten, Prozessschritt
// oder Aufgabe im Modal. Der Fortschritt hängt nicht mehr am Knoten, sondern liegt
// serverseitig in process_step_guidance_progress.
function guidanceContext(){
  if(view.level==='step'){
    const step=processStepById(view.stepId);
    if(!step) return null;
    return { step, stepId:step.id, code:step.code, title:processStepLabel(step),
      guide:guidanceByStepId.get(step.id)||guidanceByCode.get(step.code)||null };
  }
  const node=guidanceCurrentMeasure();
  if(!node) return null;
  const step=processStepForNode(node);
  const guide=(step&&guidanceByStepId.get(step.id))||guidanceForMeasure(node);
  // Konnte der Schrittbaum nicht geladen werden, liefert die Anleitung den Schrittbezug
  // weiterhin - Upload und Schritt-Dokumente bleiben dann wie bisher nutzbar.
  return { step, stepId:step?step.id:(guide?.process_step_id?String(guide.process_step_id):null),
    code:guidanceStepCode(guidanceNodeTitle(node)),
    title:guidanceNodeTitle(node), guide };
}
// Aufgaben eines Schritts einschliesslich seiner Unterschritte: die Elternkachel zeigt
// den Rollup, das Blatt genau seine eine Aufgabe.
function guidanceTasksForContext(ctx){
  if(!ctx) return [];
  if(ctx.stepId){
    const ids=new Set(processStepSubtreeIds(ctx.stepId));
    const pbc=luminaPbcRows();
    if(pbc){
      const matched=pbc.rows.map((row,ri)=>({row,ri,sub:pbc.sub,state:ensureTaskState(pbc.sub.data,row,ri)}))
        .filter(entry=>ids.has(String(entry.state.remoteProcessStepId||'')));
      if(matched.length) return matched;
    }
  }
  // Rueckfall auf das alte Präfix-Matching, solange eine Aufgabe keinen Schrittbezug hat.
  const byCode=guidanceTasks(ctx.code);
  if(byCode.length&&ctx.stepId) console.warn('Aufgaben ohne process_step_id, Rückfall auf Titel-Präfix für',ctx.code);
  return byCode;
}
// Datenraum der Kachel: Aufgabendokumente des Teilbaums plus Dokumente am Schritt selbst.
// Bewusst ohne folderPath - die Ablage im Themenordner bleibt davon unberuehrt.
function stepDataroomDocuments(ctx){
  if(!ctx) return [];
  const tasks=guidanceTasksForContext(ctx);
  const fromTasks=tasks.flatMap(task=>(task.state.documents||[])
    .map(doc=>({...doc,taskNumber:doc.taskNumber||task.row[0]||''})));
  const fromSteps=(ctx.stepId?processStepSubtreeIds(ctx.stepId):[])
    .flatMap(id=>guidanceStepDocuments(id));
  return [...fromTasks,...fromSteps];
}

async function loadProcessStepGuidance(){
  guidanceByCode.clear();
  guidanceByStepId.clear();
  const {data,error}=await luminaDb.from('process_step_guidance').select('*,process_steps!inner(code,legacy_source_key)');
  if(error){ console.warn('Prozessschritt-Anleitungen konnten nicht geladen werden',error); return; }
  (data||[]).forEach(row=>{
    const code=row.process_steps?.code||String(row.process_steps?.legacy_source_key||'').replace(/^taxonomy:/,'');
    if(code) guidanceByCode.set(String(code),row);
    if(row.process_step_id) guidanceByStepId.set(String(row.process_step_id),row);
  });
}

// Der Kachelbaum. Ohne diese Tabelle faellt das Cockpit auf den bisherigen
// State-Pfad zurueck - deshalb wird ein Fehler nur gemeldet, nicht geworfen.
async function loadProcessStepTree(){
  processStepsById.clear();
  processStepsByParent.clear();
  processStepIdByCode.clear();
  const {data,error}=await luminaDb.from('process_steps').select('id,code,name,parent_id,sort_order').order('sort_order');
  if(error){ console.warn('Prozessschritte konnten nicht geladen werden',error); return; }
  (data||[]).forEach(step=>{
    const node={
      id:String(step.id),
      code:String(step.code||''),
      name:String(step.name||''),
      parentId:step.parent_id?String(step.parent_id):null,
      sortOrder:Number(step.sort_order)||0
    };
    processStepsById.set(node.id,node);
    if(node.code) processStepIdByCode.set(node.code,node.id);
    const key=node.parentId||'root';
    if(!processStepsByParent.has(key)) processStepsByParent.set(key,[]);
    processStepsByParent.get(key).push(node);
  });
  processStepsByParent.forEach(list=>list.sort((a,b)=>
    a.sortOrder-b.sortOrder||a.code.localeCompare(b.code,undefined,{numeric:true})));
}

// Kein Sicherheitszweck - der Hash erkennt nur, ob sich der Text eines Schrittes
// geändert hat und ein alter Haken damit auf eine andere Aussage zeigen würde.
function guidanceStepHash(text){
  const s=String(text||'');
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(16).padStart(8,'0');
}
function guidanceProgressKey(stepId,index){ return `${stepId}|${index}`; }
// Die Guidance-Bloecke laufen auf zwei Oberflaechen. Nach einer Aenderung muss die
// gerade sichtbare mitgezogen werden, sonst bleibt das Modal auf altem Stand stehen.
function refreshGuidanceSurfaces(){
  render();
  if(activeTaskContext) renderTaskModal();
}
// Ein Haken zählt nur, wenn der Text seit dem Setzen unverändert ist.
function guidanceChecksFor(stepId,steps){
  return (steps||[]).map((text,i)=>{
    const entry=stepId?guidanceProgress.get(guidanceProgressKey(stepId,i)):null;
    return !!(entry&&entry.completed&&entry.hash===guidanceStepHash(text));
  });
}
async function loadGuidanceStepProgress(){
  guidanceProgress.clear();
  const {data,error}=await luminaDb.from('process_step_guidance_progress')
    .select('process_step_id,step_index,step_text_hash,completed');
  // Fehlt die Tabelle (aeltere Datenbank), bleiben die Haken einfach leer.
  if(error){ console.warn('Anleitungs-Fortschritt konnte nicht geladen werden',error); return; }
  (data||[]).forEach(row=>guidanceProgress.set(
    guidanceProgressKey(String(row.process_step_id),Number(row.step_index)),
    {completed:!!row.completed,hash:String(row.step_text_hash||'')}));
}
async function toggleGuidanceStep(stepId,index,text,naechster){
  if(!stepId){ showTopNote('Für diese Kachel ist kein Prozessschritt hinterlegt.',true); return; }
  const hash=guidanceStepHash(text);
  // Sofort anzeigen, bei Fehler zurücknehmen - sonst wirkt der Klick verzögert.
  const vorher=guidanceProgress.get(guidanceProgressKey(stepId,index))||null;
  guidanceProgress.set(guidanceProgressKey(stepId,index),{completed:naechster,hash});
  refreshGuidanceSurfaces();
  const {error}=await luminaDb.rpc('set_guidance_step_completed',{
    p_process_step_id:stepId, p_step_index:index, p_step_text_hash:hash, p_completed:naechster
  });
  if(error){
    if(vorher) guidanceProgress.set(guidanceProgressKey(stepId,index),vorher);
    else guidanceProgress.delete(guidanceProgressKey(stepId,index));
    showTopNote('Schritt konnte nicht gespeichert werden: '+(error.message||error),true);
    refreshGuidanceSurfaces();
  }
}

async function loadProcessStepComments(){
  stepCommentsByStep.clear();
  const {data,error}=await luminaDb.from('process_step_comments')
    .select('id,process_step_id,document_id,parent_comment_id,body,author_user_id,created_at,deleted_at')
    .order('created_at');
  // Fehlt die Tabelle (aeltere Datenbank), bleibt der Kommentarblock einfach leer.
  if(error){ console.warn('Kommentare konnten nicht geladen werden',error); return; }
  (data||[]).forEach(row=>{
    const stepId=String(row.process_step_id||''); if(!stepId) return;
    if(!stepCommentsByStep.has(stepId)) stepCommentsByStep.set(stepId,[]);
    stepCommentsByStep.get(stepId).push({
      id:String(row.id),
      stepId,
      documentId:row.document_id?String(row.document_id):null,
      parentId:row.parent_comment_id?String(row.parent_comment_id):null,
      body:String(row.body||''),
      authorUserId:row.author_user_id?String(row.author_user_id):null,
      createdAt:row.created_at,
      deletedAt:row.deleted_at
    });
  });
}

function guidanceDownloadBlob(blob,fileName){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
// Fallback, solange die Vorlage im Bucket lumina-templates fehlt: leere Mappe aus arbeitshilfe_felder.
function guidanceBuildHelperWorkbook(guide,fileName){
  const fields=guidanceList(guide.arbeitshilfe_felder);
  const header=fields.length?fields:['Spalte 1'];
  const ws=XLSX.utils.aoa_to_sheet([header]);
  ws['!cols']=header.map(field=>({wch:Math.max(14,Math.min(38,String(field).length+4))}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Arbeitshilfe');
  XLSX.writeFile(wb,fileName.replace(/\.[^.]+$/,'')+'.xlsx');
}
async function guidanceDownloadHelper(guide){
  const button=document.getElementById('guide-helper-download');
  const fileName=String(guide.arbeitshilfe_storage_path||guide.arbeitshilfe_name||'Arbeitshilfe').split('/').pop();
  if(button){button.disabled=true;button.textContent='Wird geladen ...';}
  try{
    if(guide.arbeitshilfe_storage_path){
      const bucket=guide.arbeitshilfe_storage_bucket||'lumina-templates';
      const {data,error}=await luminaDb.storage.from(bucket).download(guide.arbeitshilfe_storage_path);
      if(!error&&data){ guidanceDownloadBlob(data,fileName); showTopNote('Arbeitshilfe heruntergeladen.'); return; }
      console.warn('Vorlage nicht im Bucket verfügbar, erzeuge leere Arbeitshilfe',error);
    }
    guidanceBuildHelperWorkbook(guide,fileName);
    showTopNote('Vorlage ist noch nicht hinterlegt — leere Arbeitshilfe aus den Spalten erzeugt.');
  }catch(error){
    showTopNote('Arbeitshilfe konnte nicht bereitgestellt werden: '+(error.message||error),true);
  }finally{
    if(button){button.disabled=false;button.textContent='Arbeitshilfe herunterladen';}
  }
}

async function guidanceSaveStatus(entry,workStatus){
  entry.state.workStatus=workStatus;
  addActivity(entry.state,`Status über die Schritt-Anleitung gesetzt: ${workStatus}`);
  try{ await saveLuminaTaskToSupabase(entry.row,entry.state); }
  catch(error){ showTopNote('Status konnte nicht gespeichert werden: '+(error.message||error),true); }
  refreshGuidanceSurfaces();
}

async function guidanceUploadDocument(ctx){
  const code=ctx?.code||'';
  const tasks=guidanceTasksForContext(ctx);
  // Der Schrittbezug kommt aus process_steps, nicht mehr nur aus der Anleitung - eine
  // Kachel kann Kinder und einen eigenen Datenraum haben, ohne dass eine Anleitung existiert.
  const stepId=ctx?.stepId||ctx?.guide?.process_step_id||null;
  const select=document.getElementById('guide-upload-task');
  const entry=tasks.find(task=>String(task.ri)===String(select?.value))||tasks[0];
  const file=document.getElementById('guide-upload-file')?.files?.[0];
  const comment=(document.getElementById('guide-upload-comment')?.value||'').trim();
  // Prozessschritte ohne bestaetigte Einzelmassnahme haben keine Aufgabe, gegen die abgelegt
  // werden koennte. Dann laeuft der Upload gegen den Prozessschritt (documents.task_id bleibt null).
  const stepOnly=!tasks.length;
  if(!file){ showTopNote('Bitte eine Datei auswählen.',true); return; }
  if(stepOnly&&!stepId){ showTopNote('Für diesen Prozessschritt ist keine Schrittkennung hinterlegt.',true); return; }
  if(!stepOnly&&!entry?.state.remoteTaskId){ showTopNote('Diese Aufgabe ist noch keinem Supabase-Datensatz zugeordnet.',true); return; }
  const button=document.getElementById('guide-upload-save');
  if(button){button.disabled=true;button.textContent='Wird hochgeladen ...';}
  let prepared=null;
  try{
    const {data,error}=stepOnly
      ?await luminaDb.rpc('prepare_step_document_upload',{
        p_process_step_id:stepId,
        p_original_file_name:file.name,
        p_mime_type:file.type||'application/octet-stream',
        p_file_size:file.size,
        p_upload_comment:comment||null
      })
      :await luminaDb.rpc('prepare_document_upload',{
        p_task_id:entry.state.remoteTaskId,
        p_original_file_name:file.name,
        p_mime_type:file.type||'application/octet-stream',
        p_file_size:file.size,
        p_upload_comment:comment||null
      });
    if(error)throw error;
    prepared=Array.isArray(data)?data[0]:data;
    if(!prepared?.storage_path)throw new Error('Supabase hat keinen Speicherpfad geliefert.');
    const {error:uploadError}=await luminaDb.storage.from(prepared.storage_bucket||'lumina-datarooms')
      .upload(prepared.storage_path,file,{contentType:file.type||'application/octet-stream',upsert:false});
    if(uploadError)throw uploadError;
    const record={
      id:prepared.document_id,remoteDocumentId:prepared.document_id,remoteVersionId:prepared.version_id,
      name:file.name,size:file.size,mime:file.type||'application/octet-stream',comment,
      uploadedAt:luminaNow(),version:1,
      storageBucket:prepared.storage_bucket||'lumina-datarooms',storagePath:prepared.storage_path,persisted:true
    };
    if(stepOnly){
      // stepId statt guide.process_step_id: eine Kachel kann einen Datenraum haben,
      // ohne dass fuer sie eine Anleitung hinterlegt ist.
      const key=String(stepId);
      if(!guidanceStepDocsByStep.has(key)) guidanceStepDocsByStep.set(key,[]);
      guidanceStepDocsByStep.get(key).push({...record,stepLevel:true,processStepId:key,stepCode:String(code)});
      showTopNote('Dokument dem Prozessschritt zugeordnet und dauerhaft gespeichert.');
    }else{
      entry.state.documents.push({
        ...record,
        folderPath:entry.state.folderPath||ensureExplorerFolder(entry.state).key,
        taskId:entry.row[12],taskNumber:entry.row[0]||'',taskTitle:entry.row[3]||entry.row[1]||''
      });
      entry.state.workStatus='Eingereicht';
      addActivity(entry.state,`Dokument über die Schritt-Anleitung abgelegt: ${file.name}`);
      try{ await saveLuminaTaskToSupabase(entry.row,entry.state); }
      catch(statusError){ console.warn('Status konnte nicht gespeichert werden',statusError); }
      showTopNote('Dokument dauerhaft gespeichert.');
    }
    refreshGuidanceSurfaces();
  }catch(error){
    if(prepared?.document_id) await luminaDb.rpc('cancel_document_upload',{p_document_id:prepared.document_id});
    showTopNote('Upload fehlgeschlagen: '+(error.message||error),true);
    if(button){button.disabled=false;button.textContent='Datei hochladen';}
  }
}

function taskRequiredDocs(row,maxLength){
  const text=String(row[5]||'').replace(/\s+/g,' ').trim();
  if(!maxLength||text.length<=maxLength) return text;
  return text.slice(0,maxLength).replace(/[\s;,·(–-]+$/,'')+'…';
}

function guidanceBulletBlock(title,items,extraClass){
  if(!items.length) return '';
  return `<div class="guide-section"><div class="guide-section-title">${luminaEsc(title)}</div><ul class="guide-list ${extraClass||''}">${items.map(item=>`<li>${luminaEsc(item)}</li>`).join('')}</ul></div>`;
}

/* ---------- Bausteine der Kachelansicht ----------
   Seite (Station/Kategorie) und Aufgaben-Modal (einzelne Maßnahme) rendern dieselben
   Blöcke aus denselben Funktionen. Ohne diese Trennung stünde dasselbe Markup an zwei
   Stellen - dieselbe Doppelpflege, die auf Datenebene gerade beseitigt wurde. */
function guidanceViewData(ctx){
  const guide=ctx.guide||null;
  const steps=guide?guidanceList(guide.was_ist_zu_tun):[];
  const tasks=guidanceTasksForContext(ctx);
  const allDocs=stepDataroomDocuments(ctx);
  const kinder=processStepChildren(ctx.stepId);
  const checks=guidanceChecksFor(ctx.stepId,steps);
  return { ctx, guide, code:ctx.code, steps, checks, tasks, allDocs, kinder,
    doneCount:checks.filter(Boolean).length,
    openTasks:tasks.filter(task=>!['Abgeschlossen','Nicht relevant'].includes(task.state.workStatus)).length,
    overdue:tasks.filter(task=>taskTiming(task.row,task.state)==='Überfällig').length,
    canUpload:tasks.length?true:!!ctx.stepId,
    statusOptions:Object.keys(LUMINA_WORK_TO_REMOTE) };
}

function guidanceAnleitungBlock(d){
  const guide=d.guide; if(!guide) return '';
  const hinweis=String(guide.datenbasis_hinweis||'').trim();

/* ---------- Kommentare je Kachel ----------
   Anker ist immer der Prozessschritt. Ein Kommentar zu einer Datei ist ein Kommentar
   am Schritt mit gesetztem document_id - eine Tabelle, ein Ort zum Suchen.
   Fäden laufen über parent_comment_id, bewusst nur eine Antwortebene tief. */
let stepCommentReplyTo=null;

function stepCommentsFor(stepId){
  const list=stepId?(stepCommentsByStep.get(String(stepId))||[]):[];
  const roots=list.filter(entry=>!entry.parentId);
  const repliesByParent=new Map();
  list.filter(entry=>entry.parentId).forEach(entry=>{
    if(!repliesByParent.has(entry.parentId)) repliesByParent.set(entry.parentId,[]);
    repliesByParent.get(entry.parentId).push(entry);
  });
  // Ein gelöschter Wurzelkommentar bleibt sichtbar, solange Antworten daran hängen -
  // sonst verlören sie ihren Bezugspunkt.
  return roots
    .filter(entry=>!entry.deletedAt||(repliesByParent.get(entry.id)||[]).some(reply=>!reply.deletedAt))
    .map(entry=>({...entry,replies:(repliesByParent.get(entry.id)||[]).filter(reply=>!reply.deletedAt)}));
}

function stepCommentMarkup(entry,docsById,isReply){
  const eigen=entry.authorUserId&&luminaCurrentUserId&&entry.authorUserId===luminaCurrentUserId;
  const doc=entry.documentId?docsById.get(entry.documentId):null;
  if(entry.deletedAt){
    return `<div class="guide-comment${isReply?' is-reply':''}"><div class="guide-comment-body is-deleted">Diese Notiz wurde gelöscht.</div></div>`;
  }
  return `<div class="guide-comment${isReply?' is-reply':''}">
    <div class="guide-comment-head">
      <span class="guide-comment-author">${eigen?'Sie':'Teammitglied'}</span>
      <span class="guide-comment-date">${luminaEsc(formatDateTime(entry.createdAt))}</span>
      ${doc?`<span class="guide-comment-doc" title="${luminaEsc(doc.name)}">zu ${luminaEsc(doc.name)}</span>`:''}
    </div>
    <div class="guide-comment-body">${luminaEsc(entry.body)}</div>
    <div class="guide-comment-actions">
      ${isReply?'':`<button type="button" class="guide-comment-action" data-comment-reply="${luminaEsc(entry.id)}">Antworten</button>`}
      ${eigen?`<button type="button" class="guide-comment-action danger" data-comment-delete="${luminaEsc(entry.id)}">Löschen</button>`:''}
    </div>
  </div>`;
}

function renderStepCommentBlock(ctx){
  if(!ctx?.stepId){
    return `<section class="guide-block">
      <div class="guide-block-head"><div class="guide-block-title">Notizen</div></div>
      <div class="guide-empty">Für diese Kachel ist kein Prozessschritt hinterlegt – ohne ihn können keine Notizen gespeichert werden.</div>
    </section>`;
  }
  const threads=stepCommentsFor(ctx.stepId);
  // Beim Wechsel auf eine andere Kachel darf kein Antwortfeld stehen bleiben.
  if(stepCommentReplyTo&&!threads.some(entry=>String(entry.id)===String(stepCommentReplyTo))) stepCommentReplyTo=null;
  const anzahl=threads.reduce((sum,entry)=>sum+1+entry.replies.length,0);
  const docsById=new Map(stepDataroomDocuments(ctx).map(doc=>[String(doc.remoteDocumentId||doc.id),doc]));
  const eingabe=code=>`<div class="guide-comment-form">
    <textarea id="guide-comment-input${code}" rows="3" placeholder="Notiz zu dieser Maßnahme ..."></textarea>
    <div class="guide-comment-form-actions">
      ${code?`<button type="button" class="btn-secondary" id="guide-comment-cancel">Abbrechen</button>`:''}
      <button type="button" class="btn-save" data-comment-save="${code?'reply':'root'}">${code?'Antwort speichern':'Notiz speichern'}</button>
    </div>
  </div>`;
  return `
    <section class="guide-block">
      <div class="guide-block-head"><div class="guide-block-title">Notizen</div><div class="guide-block-hint">${anzahl===1?'1 Eintrag':anzahl+' Einträge'}</div></div>
      ${threads.length?`<div class="guide-comments">${threads.map(entry=>`
        ${stepCommentMarkup(entry,docsById,false)}
        ${entry.replies.map(reply=>stepCommentMarkup(reply,docsById,true)).join('')}
        ${String(stepCommentReplyTo)===String(entry.id)?eingabe('-reply'):''}
      `).join('')}</div>`:'<div class="guide-empty">Noch keine Notiz zu dieser Maßnahme.</div>'}
      ${stepCommentReplyTo?'':eingabe('')}
    </section>`;
}

// root und neuZeichnen sind austauschbar, damit derselbe Block auf der Seite
// (form-container, render) und im Aufgaben-Modal (task-modal-main, renderTaskModal)
// läuft, ohne dass es zwei Fassungen gibt.
function bindStepCommentBlock(ctx,root,neuZeichnen){
  if(!ctx?.stepId) return;
  const container=root||document.getElementById('form-container');
  const zeichnen=neuZeichnen||render;
  container.querySelectorAll('[data-comment-reply]').forEach(button=>button.addEventListener('click',()=>{
    stepCommentReplyTo=button.dataset.commentReply;
    zeichnen();
  }));
  const cancel=container.querySelector('#guide-comment-cancel');
  if(cancel) cancel.addEventListener('click',()=>{ stepCommentReplyTo=null; zeichnen(); });
  container.querySelectorAll('[data-comment-save]').forEach(button=>button.addEventListener('click',()=>{
    const istAntwort=button.dataset.commentSave==='reply';
    const feld=container.querySelector(istAntwort?'#guide-comment-input-reply':'#guide-comment-input');
    saveStepComment(ctx,feld?feld.value:'',istAntwort?stepCommentReplyTo:null,button,zeichnen);
  }));
  container.querySelectorAll('[data-comment-delete]').forEach(button=>button.addEventListener('click',()=>
    deleteStepComment(button.dataset.commentDelete,button,zeichnen)));
}

async function saveStepComment(ctx,body,parentId,button,neuZeichnen){
  const text=String(body||'').trim();
  if(!text){ showTopNote('Bitte eine Notiz eingeben.',true); return; }
  if(button){ button.disabled=true; button.textContent='Wird gespeichert ...'; }
  try{
    const {error}=await luminaDb.rpc('add_process_step_comment',{
      p_process_step_id:ctx.stepId,
      p_body:text,
      p_document_id:null,
      p_parent_comment_id:parentId||null
    });
    if(error) throw error;
    await loadProcessStepComments();
    stepCommentReplyTo=null;
    showTopNote('Notiz gespeichert.');
    (neuZeichnen||render)();
  }catch(error){
    showTopNote('Notiz konnte nicht gespeichert werden: '+(error.message||error),true);
    if(button){ button.disabled=false; button.textContent=parentId?'Antwort speichern':'Notiz speichern'; }
  }
}

async function deleteStepComment(commentId,button,neuZeichnen){
  if(!confirm('Diese Notiz löschen?')) return;
  if(button) button.disabled=true;
  try{
    const {error}=await luminaDb.rpc('delete_process_step_comment',{p_comment_id:commentId});
    if(error) throw error;
    await loadProcessStepComments();
    showTopNote('Notiz gelöscht.');
    (neuZeichnen||render)();
  }catch(error){
    showTopNote('Notiz konnte nicht gelöscht werden: '+(error.message||error),true);
    if(button) button.disabled=false;
  }
}

async function loadLuminaFromSupabase(){
  setLuminaSyncState('Daten werden geladen ...');
  const [{data:projects,error:projectError},{data:tasks,error:taskError},{data:roles,error:roleError},{data:sourceStates,error:sourceError},{data:documents,error:documentError}]=await Promise.all([
    luminaDb.from('projects').select('id,name,reporting_date,status,companies(name)').limit(10),
    luminaDb.from('tasks').select('id,source_number,process_step_id,work_status,review_status,internal_comment,due_date_override,updated_at').order('source_number'),
    luminaDb.from('responsibility_roles').select('id,role_key,display_name,first_name,last_name,email').order('role_key'),
    luminaDb.rpc('get_lumina_source_state'),
    luminaDb.from('documents').select('id,task_id,folder_id,display_name,document_status,created_at,document_versions(id,version_number,storage_bucket,storage_path,original_file_name,mime_type,file_size,upload_comment,created_at)').is('archived_at',null).order('created_at')
  ]);
  if(projectError)throw projectError;if(taskError)throw taskError;if(roleError)throw roleError;if(sourceError)throw sourceError;if(documentError)throw documentError;
  if(!projects||!projects.length)throw new Error('Für dieses Konto ist kein LUMINA-Projekt freigeschaltet.');
  if(!sourceStates||!sourceStates.length||!Array.isArray(sourceStates[0].state))throw new Error('Der geschützte LUMINA-Projektstand fehlt.');
  stations.splice(0,stations.length,...sourceStates[0].state);
  await loadProcessStepTree();
  await loadProcessStepGuidance();
  const project=projects[0],companyName=project.companies?.name||project.name||'Serafin GmbH';
  const master=findFirstSubOfType('form');
  const masterSub=stations.flatMap(s=>s.measures||[]).flatMap(m=>m.subitems||[]).find(sub=>Array.isArray(sub.fields)&&sub.fields.some(field=>field.key==='firmierung'));
  if(masterSub){masterSub.data=masterSub.data||{};masterSub.data.firmierung=companyName;if(project.reporting_date)masterSub.data.stichtag=project.reporting_date;}
  const rolesSub=findFirstSubOfType('roles');
  if(rolesSub){rolesSub.data=rolesSub.data||{};rolesSub.data.roles=(roles||[]).map(role=>({role:role.role_key,vorname:role.first_name||'',nachname:role.last_name||'',email:role.email||'',remoteRoleId:role.id}));}
  const pbc=luminaPbcRows();
  if(pbc){
    const byNumber=new Map((tasks||[]).map(task=>[String(task.source_number||''),task]));
    pbc.rows.forEach((row,ri)=>{
      const remote=byNumber.get(String(row[0]||''));if(!remote)return;
      const state=ensureTaskState(pbc.sub.data,row,ri);
      state.remoteTaskId=remote.id;
      // Ab hier haengt die Aufgabe am Prozessschritt, nicht mehr am Stationstext der Zeile.
      state.remoteProcessStepId=remote.process_step_id?String(remote.process_step_id):null;
      state.workStatus=LUMINA_WORK_FROM_REMOTE[remote.work_status]||state.workStatus;
      state.reviewStatus=LUMINA_REVIEW_FROM_REMOTE[remote.review_status]||state.reviewStatus;
      state.internalComment=remote.internal_comment||'';
      state.remoteUpdatedAt=remote.updated_at;
      state.dataRoomUrl=`${LUMINA_PUBLIC_APP_URL}?task=${encodeURIComponent(row[0])}&view=dataroom`;
      if(remote.due_date_override)row[10]=remote.due_date_override;
    });
    const stateByRemoteTask=new Map();
    pbc.rows.forEach((row,ri)=>{const state=ensureTaskState(pbc.sub.data,row,ri);state.documents=[];if(state.remoteTaskId)stateByRemoteTask.set(state.remoteTaskId,{state,row});});
    (documents||[]).forEach(document=>{
      const target=stateByRemoteTask.get(document.task_id);if(!target)return;
      const versions=(document.document_versions||[]).slice().sort((a,b)=>(b.version_number||0)-(a.version_number||0));
      const version=versions[0];if(!version)return;
      target.state.documents.push({id:document.id,remoteDocumentId:document.id,remoteVersionId:version.id,name:version.original_file_name||document.display_name,size:version.file_size||0,mime:version.mime_type||'application/octet-stream',comment:version.upload_comment||'',folderPath:target.state.folderPath||ensureExplorerFolder(target.state).key,taskId:target.row[12],taskNumber:target.row[0]||'',taskTitle:target.row[3]||target.row[1]||'',uploadedAt:version.created_at||document.created_at,version:version.version_number||1,storageBucket:version.storage_bucket,storagePath:version.storage_path,persisted:true});
    });
  }
  await loadGuidanceStepDocuments(documents);
  await loadProcessStepComments();
  await loadGuidanceStepProgress();
  setLuminaSyncState(`${tasks.length} Aufgaben · ${(documents||[]).length} Dokumente aus Supabase`);
}

// Dokumente ohne task_id haengen am Prozessschritt. Die Zuordnung laeuft ueber den
// Datenraumordner des Schritts (dataroom_folders.process_step_id).
async function loadGuidanceStepDocuments(documents){
  guidanceStepDocsByStep.clear();
  const taskless=(documents||[]).filter(document=>!document.task_id&&document.folder_id);
  if(!taskless.length) return;
  const {data:folders,error}=await luminaDb.from('dataroom_folders').select('id,process_step_id').not('process_step_id','is',null);
  if(error){ console.warn('Prozessschritt-Ordner konnten nicht geladen werden',error); return; }
  const stepByFolder=new Map((folders||[]).map(folder=>[folder.id,String(folder.process_step_id)]));
  taskless.forEach(document=>{
    const stepId=stepByFolder.get(document.folder_id); if(!stepId)return;
    const versions=(document.document_versions||[]).slice().sort((a,b)=>(b.version_number||0)-(a.version_number||0));
    const version=versions[0]; if(!version)return;
    if(!guidanceStepDocsByStep.has(stepId)) guidanceStepDocsByStep.set(stepId,[]);
    guidanceStepDocsByStep.get(stepId).push({
      id:document.id,remoteDocumentId:document.id,remoteVersionId:version.id,
      name:version.original_file_name||document.display_name,size:version.file_size||0,
      mime:version.mime_type||'application/octet-stream',comment:version.upload_comment||'',
      uploadedAt:version.created_at||document.created_at,version:version.version_number||1,
      storageBucket:version.storage_bucket,storagePath:version.storage_path,persisted:true,
      stepLevel:true,processStepId:stepId
    });
  });
}

async function saveLuminaTaskToSupabase(row,state){
  if(!state.remoteTaskId)throw new Error('Diese Aufgabe ist noch keinem Supabase-Datensatz zugeordnet.');
  setLuminaSyncState('Speichert ...');
  const {data,error}=await luminaDb.rpc('update_task_state',{
    p_task_id:state.remoteTaskId,
    p_work_status:LUMINA_WORK_TO_REMOTE[state.workStatus]||'open',
    p_review_status:LUMINA_REVIEW_TO_REMOTE[state.reviewStatus]||'unreviewed',
    p_internal_comment:state.internalComment||null,
    p_due_date_override:row[10]||null
  });
  if(error)throw error;
  state.remoteUpdatedAt=data&&data.updated_at;
  setLuminaSyncState('In Supabase gespeichert');
}

function digestTodayISO(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function digestAddDays(iso,days){const date=new Date(`${iso}T12:00:00Z`);date.setUTCDate(date.getUTCDate()+days);return date.toISOString().slice(0,10);}
function digestOpen(title,sub){document.getElementById('digest-modal-title').textContent=title;document.getElementById('digest-modal-sub').textContent=sub||'';document.getElementById('digest-modal-status').textContent='';document.getElementById('digest-modal-backdrop').classList.add('open');document.getElementById('digest-modal-backdrop').setAttribute('aria-hidden','false');}
function digestClose(){document.getElementById('digest-modal-backdrop').classList.remove('open');document.getElementById('digest-modal-backdrop').setAttribute('aria-hidden','true');}
function myDayEntries(){const pbc=luminaPbcRows();if(!pbc)return[];return pbc.rows.map((row,ri)=>{const state=ensureTaskState(pbc.sub.data,row,ri);return{row,ri,state,due:taskEffectiveDate(row),title:taskDisplayTitle(row,state),roomUrl:taskPrimaryDataRoomLink(state)};}).filter(entry=>!['Abgeschlossen','Nicht relevant'].includes(entry.state.workStatus)).sort((left,right)=>(left.due||'9999-12-31').localeCompare(right.due||'9999-12-31')||String(left.row[0]||'').localeCompare(String(right.row[0]||''),'de',{numeric:true}));}
function inboxMessageHtml(message){return `<div class="inbox-message ${message.is_read?'':'unread'}"><span class="inbox-dot"></span><div><div class="inbox-title">${luminaEsc(message.subject)}</div><div class="inbox-meta">Aufgabe ${luminaEsc(message.task_number||'–')} · von ${luminaEsc(message.sender_name||message.sender_email||'Unbekannt')} · ${luminaEsc(formatDateTime(message.created_at))}</div><div class="inbox-body">${luminaEsc(message.body_text)}</div></div><button type="button" class="inbox-open" data-inbox-task="${luminaEsc(message.task_number||'')}" data-inbox-id="${luminaEsc(message.task_id)}" data-inbox-message="${luminaEsc(message.id)}">Öffnen & antworten</button></div>`;}
function bindInboxLinks(){document.querySelectorAll('[data-inbox-task]').forEach(button=>button.onclick=()=>{const pbc=luminaPbcRows();if(!pbc)return;const ri=pbc.rows.findIndex((row,index)=>String(row[0]||'')===button.dataset.inboxTask||ensureTaskState(pbc.sub.data,row,index).remoteTaskId===button.dataset.inboxId);if(ri>=0){digestClose();activeCommunicationReply=null;activeCommunicationMessageId=button.dataset.inboxMessage||null;openTaskModal(pbc.sub,ri,'communication');}});}
async function getInboxMessages(){const {data,error}=await luminaRpc('get_my_task_inbox');if(error)throw error;return data||[];}
async function refreshInboxCount(){try{const messages=await getInboxMessages(),unread=messages.filter(message=>!message.is_read).length,badge=document.getElementById('inbox-count');if(!badge)return;badge.textContent=String(unread);badge.classList.toggle('visible',unread>0);}catch(error){console.warn('Eingangskorb konnte nicht aktualisiert werden',error);}}
async function renderInbox(){digestOpen('Eingangskorb','Adressierte Kommentare, Rückfragen und Antworten');document.getElementById('digest-modal-send').style.display='none';const content=document.getElementById('digest-modal-content');content.innerHTML='<div class="digest-empty">Nachrichten werden geladen …</div>';try{const messages=await getInboxMessages();content.innerHTML=messages.length?messages.map(inboxMessageHtml).join(''):'<div class="digest-empty">Ihr Eingangskorb ist leer.</div>';bindInboxLinks();}catch(error){content.innerHTML=`<div class="digest-empty">${luminaEsc(error.message||'Eingangskorb konnte nicht geladen werden.')}</div>`;}}
async function renderMyDay(){
  const today=digestTodayISO(),soon=digestAddDays(today,14),entries=myDayEntries();
  const groups=[{title:'Überfällig',items:entries.filter(entry=>entry.due&&entry.due<today)},{title:'Heute fällig',items:entries.filter(entry=>entry.due===today)},{title:'In den nächsten 14 Tagen',items:entries.filter(entry=>entry.due>today&&entry.due<=soon)},{title:'Später anstehend',items:entries.filter(entry=>entry.due>soon)},{title:'Ohne festen Termin',items:entries.filter(entry=>!entry.due)}],visible=groups.filter(group=>group.items.length);
  digestOpen('Mein Tag',`Persönliche Aufgabenübersicht · ${formatDateDE(today)}`);document.getElementById('digest-modal-send').style.display='none';
  const content=document.getElementById('digest-modal-content');content.innerHTML='<div class="digest-empty">Übersicht wird geladen …</div>';let inbox=[];try{inbox=await getInboxMessages();}catch(error){console.warn(error);}const unread=inbox.filter(message=>!message.is_read),messageSection=unread.length?`<section class="digest-day-group"><div class="digest-group-title"><span>Neue Nachrichten</span><span class="digest-group-meta">${unread.length} ungelesen</span></div>${unread.map(inboxMessageHtml).join('')}</section>`:'';
  content.innerHTML=`<div class="digest-summary"><span class="digest-chip">${entries.length} offene Aufgaben</span><span class="digest-chip">Neue Nachrichten: ${unread.length}</span>${groups.slice(0,3).map(group=>`<span class="digest-chip">${luminaEsc(group.title)}: ${group.items.length}</span>`).join('')}</div>${messageSection}${visible.map(group=>`<section class="digest-day-group"><div class="digest-group-title"><span>${luminaEsc(group.title)}</span><span class="digest-group-meta">${group.items.length} Aufgabe${group.items.length===1?'':'n'}</span></div>${group.items.map(entry=>`<div class="digest-task"><strong>${luminaEsc(entry.row[0]||'–')}</strong><div><div class="digest-task-title">${luminaEsc(entry.title)}</div><div class="digest-task-sub">${luminaEsc(entry.row[5]||'')}</div></div><div>${luminaEsc(entry.due?formatDateDE(entry.due):'ohne Termin')}</div><a href="${luminaEsc(entry.roomUrl||'#')}" ${entry.roomUrl?'':'aria-disabled="true"'}>Datenraum öffnen</a></div>`).join('')}</section>`).join('')||'<div class="digest-empty">Aktuell stehen keine offenen Aufgaben an.</div>'}`;bindInboxLinks();
}
let adminDigestPreview=null;
async function renderAdminDigestPreview(){
  digestOpen('Alle benachrichtigen','Rollenweise Sammel-E-Mails · nach Fälligkeit sortiert');const content=document.getElementById('digest-modal-content'),send=document.getElementById('digest-modal-send'),status=document.getElementById('digest-modal-status');content.innerHTML='<div class="digest-empty">Vorschau wird geladen …</div>';send.style.display='none';
  try{const response=await fetch('/api/notifications/role-digests',{cache:'no-store'}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Vorschau konnte nicht geladen werden.');adminDigestPreview=payload;const taskCount=payload.digests.reduce((sum,digest)=>sum+digest.tasks.length,0);content.innerHTML=`<div class="digest-summary"><span class="digest-chip">${payload.digests.length} Empfänger</span><span class="digest-chip">${taskCount} offene Aufgaben</span></div>${payload.digests.map(digest=>`<section class="digest-role-group"><div class="digest-group-title"><span>${luminaEsc(digest.recipientName)} · ${luminaEsc(digest.role)}</span><span class="digest-group-meta">${luminaEsc(digest.email)} · ${digest.tasks.length} Aufgaben</span></div>${digest.tasks.map(task=>`<div class="digest-task"><strong>${luminaEsc(task.number)}</strong><div><div class="digest-task-title">${luminaEsc(task.title)}</div><div class="digest-task-sub">${luminaEsc(task.requiredDocuments)}</div></div><div>${luminaEsc(task.dueDate?formatDateDE(task.dueDate):'ohne Termin')}</div><a href="${luminaEsc(task.link)}" target="_blank" rel="noopener">Datenraum öffnen</a></div>`).join('')}</section>`).join('')}`;status.textContent=payload.smtpConfigured?'Versand ist eingerichtet. Bitte prüfen Sie die Vorschau vor dem Senden.':'Vorschau bereit. Der IONOS-Versand muss in Vercel noch eingerichtet werden.';send.style.display='inline-flex';send.disabled=!payload.smtpConfigured;}catch(error){content.innerHTML=`<div class="digest-empty">${luminaEsc(error.message||'Vorschau konnte nicht geladen werden.')}</div>`;status.textContent='';}
}
async function sendAdminDigests(){if(!adminDigestPreview||!confirm(`Jetzt ${adminDigestPreview.digests.length} rollenbezogene E-Mails versenden?`))return;const send=document.getElementById('digest-modal-send'),status=document.getElementById('digest-modal-status');send.disabled=true;send.textContent='E-Mails werden gesendet …';status.textContent='Bitte warten. Das Fenster nicht schließen.';try{const response=await fetch('/api/notifications/role-digests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed:true})}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Versand fehlgeschlagen.');status.textContent=`${payload.sent.length} E-Mails wurden erfolgreich versendet.`;send.style.display='none';}catch(error){status.textContent=error.message||'Versand fehlgeschlagen.';send.disabled=false;}finally{send.textContent='Jetzt an alle senden';}}

async function startLuminaForSession(session){
  // Wird gebraucht, um eigene Kommentare von fremden zu unterscheiden (Loeschen-Aktion).
  luminaCurrentUserId=session.user?.id?String(session.user.id):null;
  document.getElementById('lumina-session-email').textContent=session.user.email||'';
  document.getElementById('btn-notify-all').style.display=session.user.email?.toLowerCase()==='admin@volkerkusch.de'?'inline-flex':'none';
  await loadLuminaFromSupabase();
  document.body.classList.add('lumina-authenticated');
  render();
  await refreshInboxCount();
  const requestedTask=new URLSearchParams(location.search).get('task');
  if(requestedTask){const pbc=luminaPbcRows(),ri=pbc?.rows.findIndex((row,index)=>String(row[0])===requestedTask||ensureTaskState(pbc.sub.data,row,index).remoteTaskId===requestedTask);if(pbc&&ri>=0)openTaskModal(pbc.sub,ri,'room');}
}

async function initializeLuminaSupabase(){
  try{
    const {data:{session}}=await luminaDb.auth.getSession();
    if(session)await startLuminaForSession(session);
  }catch(error){setLuminaAuthError(error.message||'LUMINA konnte nicht geladen werden.');}
}

document.getElementById('lumina-auth-form').addEventListener('submit',async event=>{
  event.preventDefault();setLuminaAuthError('');
  const button=document.getElementById('lumina-auth-submit');button.disabled=true;button.textContent='Anmeldung läuft ...';
  try{
    const email=document.getElementById('lumina-auth-email').value.trim();
    const password=document.getElementById('lumina-auth-password').value;
    const {data,error}=await luminaDb.auth.signInWithPassword({email,password});
    if(error)throw error;
    await startLuminaForSession(data.session);
    document.getElementById('lumina-auth-password').value='';
  }catch(error){setLuminaAuthError(error.message==='Invalid login credentials'?'E-Mail oder Passwort ist nicht korrekt.':(error.message||'Anmeldung fehlgeschlagen.'));}
  finally{button.disabled=false;button.textContent='Anmelden';}
});
document.getElementById('lumina-signout').addEventListener('click',async()=>{if(window.parent!==window){window.parent.postMessage({type:'lumina-signout'},location.origin);return;}await luminaDb.auth.signOut();location.reload();});
document.getElementById('btn-my-day').addEventListener('click',renderMyDay);
document.getElementById('btn-inbox').addEventListener('click',renderInbox);
document.getElementById('btn-notify-all').addEventListener('click',renderAdminDigestPreview);
document.getElementById('digest-modal-close').addEventListener('click',digestClose);
document.getElementById('digest-modal-cancel').addEventListener('click',digestClose);
document.getElementById('digest-modal-backdrop').addEventListener('click',event=>{if(event.target.id==='digest-modal-backdrop')digestClose();});
document.getElementById('digest-modal-send').addEventListener('click',sendAdminDigests);


document.getElementById("btn-json-export").addEventListener("click", exportStateAsJson);
document.getElementById("btn-json-import").addEventListener("click", () => {
  document.getElementById("json-import-input").click();
});
document.getElementById("json-import-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => importStateFromJsonText(ev.target.result);
  reader.onerror = () => showTopNote("Datei konnte nicht gelesen werden.", true);
  reader.readAsText(file);
  e.target.value = "";
});
document.getElementById("btn-save-project-folder").addEventListener("click", saveProjectFolderFromToolbar);
document.getElementById("btn-local-reset").addEventListener("click", () => { if(confirm("Lokalen Autosave wirklich löschen und Ausgangsstand laden?")){ localStorage.removeItem(LUMINA_STORAGE_KEY); location.reload(); } });
document.getElementById("task-modal-close").addEventListener("click", closeTaskModal);
document.getElementById("task-modal-cancel").addEventListener("click", closeTaskModal);
document.getElementById("task-modal-backdrop").addEventListener("click", e => { if(e.target.id === "task-modal-backdrop") closeTaskModal(); });
document.getElementById("task-modal-save").addEventListener("click", async () => { const button=document.getElementById('task-modal-save');button.disabled=true;try{ if(activeTaskContext && !activeTaskContext.globalRoom){ const {sub,ri}=activeTaskContext,row=sub.data.rows[ri],st=ensureTaskState(sub.data,row,ri); const c=document.getElementById("task-internal-comment"); if(c) st.internalComment=c.value; await saveLuminaTaskToSupabase(row,st); addActivity(st,"Aufgabe in Supabase gespeichert"); } saveLuminaLocal(); closeTaskModal(); render(); }catch(error){setLuminaSyncState('Speichern fehlgeschlagen',true);showTopNote('Supabase-Speichern fehlgeschlagen: '+error.message,true);}finally{button.disabled=false;} });
document.getElementById("task-modal-delete-state").addEventListener("click", () => { if(activeTaskContext && !activeTaskContext.globalRoom && confirm("Status, Einreichungen und Verlauf dieser Aufgabe zurücksetzen?")){ const {sub,ri}=activeTaskContext,row=sub.data.rows[ri]; if(sub.data.taskStates && row[12]) delete sub.data.taskStates[row[12]]; renderTaskModal(); scheduleLuminaSave(); } });
document.addEventListener("input", scheduleLuminaSave, true);
document.addEventListener("change", scheduleLuminaSave, true);

window.addEventListener('message',async event=>{
  if(event.origin!==location.origin||event.data?.type!=='lumina-session')return;
  try{
    const {data,error}=await luminaDb.auth.setSession({access_token:event.data.accessToken,refresh_token:event.data.refreshToken});
    if(error)throw error;
    if(data.session&&!document.body.classList.contains('lumina-authenticated'))await startLuminaForSession(data.session);
  }catch(error){setLuminaAuthError(error.message||'LUMINA konnte nicht geladen werden.');}
});
if(window.parent!==window){
  document.querySelector('.lumina-auth-card h2').textContent='Dashboard wird geladen …';
  document.querySelector('.lumina-auth-form').style.display='none';
}
initializeLuminaSupabase();
</script>
