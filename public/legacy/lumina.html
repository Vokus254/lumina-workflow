    { key: "pruef", label: "Prüfungsfeld", colClass: "col-pf", cell: (row, ri) => pbcCellInput(row, ri, 3) },
    { key: "abteilung", label: "Abteilung", colClass: "col-abt", cell: (row, ri) => pbcCellAbteilung(row, ri) },
    { key: "unterlagen", label: "Notwendige Unterlagen", colClass: "col-unt", cell: (row, ri) => pbcCellTextarea(row, ri, 5) },
    { key: "gesellschaft", label: "betrifft Gesellschaft", colClass: "col-ges", cell: (row, ri) => pbcCellInput(row, ri, 6) },
    { key: "format", label: "Format", colClass: "col-fmt", cell: (row, ri) => pbcCellInput(row, ri, 7) },
    { key: "liefertermin", label: "Liefertermin", colClass: "col-lief", cell: (row, ri) => pbcCellLiefertermin(row, ri) },
    { key: "toffset", label: "T (Tage)", colClass: "col-toffset", cell: (row, ri) => pbcCellTOffset(row, ri) },
    { key: "datum", label: "Datum", colClass: "col-datum", cell: (row, ri) => pbcCellDatum(row, ri) },
    { key: "kommentar", label: "Kommentar", colClass: "col-komm", cell: (row, ri) => pbcCellTextarea(row, ri, 9) }
  ];
  const visibleDefs = columnDefs.filter(c => !d.hiddenColumns.has(c.key));
  const widthOf = (key) => d.columnWidths[key] || PBC_DEFAULT_COL_WIDTH[key] || 120;

  content.innerHTML = `
    <div class="pbc-columns-row">
      <button class="btn-secondary" id="btn-pbc-reset-widths">Spaltenbreiten zurücksetzen</button>
      <button class="btn-secondary" id="btn-pbc-columns">Spalten</button>
      <div class="pbc-columns-panel" id="pbc-columns-panel" style="display:${d.columnsPanelOpen ? "" : "none"};">
        ${columnDefs.map(c => `
          <label class="pbc-columns-item">
            <input type="checkbox" data-col="${c.key}" ${d.hiddenColumns.has(c.key) ? "" : "checked"}>
            ${c.label}
          </label>
        `).join("")}
      </div>
    </div>
    <div class="pbc-wrap">
      <table class="pbc-table pbc-table-resizable">
        <colgroup>
          ${visibleDefs.map(c => `<col data-colkey="${c.key}" style="width:${widthOf(c.key)}px;">`).join("")}
        </colgroup>
        <thead><tr>${visibleDefs.map(c => `<th><span class="th-label">${c.label}</span><span class="col-resize-handle" data-colkey="${c.key}"></span></th>`).join("")}<th class="col-del"></th></tr></thead>
        <tbody id="pbc-body"></tbody>
      </table>
    </div>
  `;

  document.getElementById("btn-pbc-columns").addEventListener("click", () => {
    d.columnsPanelOpen = !d.columnsPanelOpen;
    renderPbcTable(sub, visible);
  });
  document.getElementById("btn-pbc-reset-widths").addEventListener("click", () => {
    d.columnWidths = {};
    renderPbcTable(sub, visible);
  });
  document.querySelectorAll('#pbc-columns-panel input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const key = e.target.dataset.col;
      if(e.target.checked) d.hiddenColumns.delete(key);
      else d.hiddenColumns.add(key);
      renderPbcTable(sub, visible);
    });
  });

  const table = content.querySelector(".pbc-table");
  content.querySelectorAll(".col-resize-handle").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const key = handle.dataset.colkey;
      const col = table.querySelector(`col[data-colkey="${key}"]`);
      const startX = e.clientX;
      const startWidth = col.getBoundingClientRect().width;
      handle.classList.add("is-dragging");
      const onMove = (ev) => {
        const newWidth = Math.max(40, Math.round(startWidth + (ev.clientX - startX)));
        col.style.width = newWidth + "px";
      };
      const onUp = () => {
        d.columnWidths[key] = parseInt(col.style.width, 10);
        handle.classList.remove("is-dragging");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });

  const body = document.getElementById("pbc-body");
  visible.forEach(ri => {
    const row = d.rows[ri];
    const tr = document.createElement("tr");
    if(row._isNew) tr.className = "is-new";

    visibleDefs.forEach(c => tr.appendChild(c.cell(row, ri)));

    const delTd = document.createElement("td");

    delBtn.addEventListener("click", () => {
      d.rows.splice(ri, 1);
      renderPbc();
    });
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    body.appendChild(tr);
  });

  function pbcCellAbteilung(row, ri){
    const td = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "pbc-abt-cell";
    const sel = document.createElement("select");
    const roles = getRoleCatalog();
    const roleNames = roles.map(r => r.role);
    const current = row[4] || "";
    const options = current && !roleNames.includes(current) ? [current, ...roleNames] : roleNames;
    sel.innerHTML = `<option value="">–</option>` + options.map(o => `<option value="${o}" ${current === o ? "selected" : ""}>${o}</option>`).join("");
    const nameSpan = document.createElement("span");
    nameSpan.className = "pbc-abt-name";
    const updateName = () => {
      const n = resolveRoleName(d.rows[ri][4]);
      nameSpan.textContent = n || "– kein Name hinterlegt –";
      nameSpan.classList.toggle("is-empty", !n);
    };
    sel.addEventListener("change", (e) => { d.rows[ri][4] = e.target.value; updateName(); });
    wrap.appendChild(sel);
    wrap.appendChild(nameSpan);
    td.appendChild(wrap);
    updateName();
    return td;
  }

  function pbcCellDatum(row, ri){
    const td = document.createElement("td");
    td.className = "pbc-datum-cell";
    const wrap = document.createElement("div");
    wrap.className = "date-with-weekday";
    const effective = computeRowEffectiveDatum(row);
    const input = document.createElement("input");
    input.type = "date";
    input.value = effective || "";
    const wd = weekdayDE(effective);
    const wdSpan = document.createElement("span");
    if(wd){
      wdSpan.className = "weekday-badge" + (isWeekendISO(effective) ? " is-weekend" : "");
      wdSpan.textContent = wd;
    }
    input.addEventListener("change", (e) => {
      d.rows[ri][10] = e.target.value;
      renderPbc();
    });
    wrap.appendChild(input);
    if(wd) wrap.appendChild(wdSpan);
    td.appendChild(wrap);
    return td;
  }

  function pbcCellTOffset(row, ri){
    const td = document.createElement("td");
    const input = document.createElement("input");
    input.type = "number";
    input.className = "t-offset-input";
    const stichtag = getStichtagISO();
    const stored = row[11];
    let tVal = stored !== undefined && stored !== "" ? stored : "";
    if(tVal === ""){
      const eff = computeRowEffectiveDatum(row);
      if(eff) tVal = diffDaysFromStichtagISO(eff);
    }
    input.value = tVal === "" ? "" : tVal;
    if(!stichtag){ input.disabled = true; input.placeholder = "kein Stichtag"; }
    input.addEventListener("change", (e) => {
      d.rows[ri][11] = e.target.value;
      d.rows[ri][10] = "";
      renderPbc();
    });
    td.appendChild(input);
    return td;
  }

  function pbcCellInput(row, ri, ci){
    const td = document.createElement("td");
    const input = document.createElement("input");
    input.type = "text";
    input.value = row[ci] || "";
    input.addEventListener("input", (e) => { d.rows[ri][ci] = e.target.value; });
    td.appendChild(input);
    return td;
  }
  function pbcCellTextarea(row, ri, ci){
    const td = document.createElement("td");

    ta.rows = Math.min(6, Math.max(2, (row[ci] || "").split("\n").length));
    ta.value = row[ci] || "";
    ta.addEventListener("input", (e) => { d.rows[ri][ci] = e.target.value; });

    return td;
  }
  function pbcCellLiefertermin(row, ri){
    const td = document.createElement("td");
    const sel = document.createElement("select");

    const current = row[8] || "";
    const options = current && !milestoneNames.includes(current) ? [current, ...milestoneNames] : milestoneNames;

    sel.addEventListener("change", (e) => {
      d.rows[ri][8] = e.target.value;
      d.rows[ri][10] = "";

    });

  }
  function pbcCellProzess(sub, row, ri){

      : [row[1], ...sub.data.taxonomie];

  document.getElementById("btn-add-pbc-row").addEventListener("click", () => {
    const nextLfd = d.rows.length ? (parseInt(d.rows[d.rows.length - 1][0]) || d.rows.length) + 1 : 1;
    d.rows.push([String(nextLfd), "", "", "", "", "", "", "", "", ""]);
    d.rows[d.rows.length - 1]._isNew = true;
    renderPbc();
    const wrap = document.querySelector(".pbc-wrap");
    if(wrap) wrap.scrollTop = wrap.scrollHeight;
  });
}

function sanitizeFileName(name){
  // Robuste Bereinigung für Windows, OneDrive und ZIP-Exporte.
  // Entfernt insbesondere unsichtbare Unicode-Zeichen, die beim Kopieren
  // oder Bearbeiten von Ordnernamen unbemerkt entstehen können.
  let cleaned = String(name ?? "").normalize("NFKC");
  cleaned = cleaned
    .replace(/[\u0000-\u001F\u007F-\u009F]/g, "")
    .replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, "")
    .replace(/^[`´‘’'\s]+/g, "")
    .replace(/[\\/:*?"<>|]/g, "-")
    .replace(/\s+/g, " ")
    .replace(/[. ]+$/g, "")
    .trim();

  if(!cleaned) cleaned = "Ordner";
  const reserved = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i;
  if(reserved.test(cleaned)) cleaned = "_" + cleaned;
  return cleaned.slice(0, 180);
}

function getStammdaten(){
  let data = null;
  stations.forEach(s => s.measures.forEach(m => m.subitems.forEach(sub => {
    if(sub.fields && sub.fields.some(f => f.key === "firmierung")){
      data = sub.data;
    }
  })));
  data = data || {};
  const gesellschaft = sanitizeFileName((data.firmierung || "Muster GmbH").trim() || "Muster GmbH");
  const gesellschaftDisplay = (data.firmierung || "").trim() || "Muster GmbH";

  let jahr = "";
  if(data.stichtag){
    const m = /^(\d{4})/.exec(data.stichtag);
    if(m) jahr = m[1];
  }
  if(!jahr && data.geschaeftsjahr){
    const matches = data.geschaeftsjahr.match(/\d{4}/g);
    if(matches) jahr = matches[matches.length - 1];
  }
  if(!jahr) jahr = String(new Date().getFullYear());

  let stichtagDisplay = "";
  if(data.stichtag){
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(data.stichtag);
    if(m) stichtagDisplay = `${m[3]}.${m[2]}.${m[1]}`;
  }

  return { gesellschaft, gesellschaftDisplay, jahr, stichtagDisplay };
}

  const { gesellschaftDisplay, stichtagDisplay } = getStammdaten();

function buildZipFolder(zipFolder, node, path){
  const isLeaf = typeof node === "string";
  const name = isLeaf ? node : node.name;
  const folderName = sanitizeFileName(treeLabel(path) + " " + name);
  const sub = zipFolder.folder(folderName);
  const children = isLeaf ? null : node.children;
  if(children && children.length > 0){
    children.forEach((c, i) => buildZipFolder(sub, c, [...path, i]));
  }
  // JSZip speichert auch leere Verzeichniseinträge. Daher ist keine
  // Platzhalterdatei erforderlich; OneDrive zeigt die Ordner anschließend leer an.
}

async function exportTreeAsZip(sub){
  const btn = document.getElementById("btn-export-zip");
  const note = document.getElementById("export-status-note");
  if(!btn) return;
  const originalLabel = btn.textContent;
  btn.textContent = "Erzeuge ZIP …";
  btn.disabled = true;
  note.style.display = "none";
  try{
    const zip = new JSZip();
    sub.data.tree.forEach((node, i) => buildZipFolder(zip, node, [i]));
    const blob = await zip.generateAsync({ type: "blob" });
    const { gesellschaft, jahr } = getStammdaten();
    const filename = sanitizeFileName(`Jahresabschluss ${jahr} ${gesellschaft}`) + ".zip";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    note.textContent = `Heruntergeladen: ${filename}`;
    note.style.display = "";
  } catch(err){
    note.textContent = "ZIP konnte nicht erzeugt werden: " + err.message;
    note.style.display = "";
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

async function createFolderRecursive(parentHandle, node, path){
  const isLeaf = typeof node === "string";
  const name = isLeaf ? node : node.name;
  const folderName = sanitizeFileName(treeLabel(path) + " " + name);
  const dirHandle = await parentHandle.getDirectoryHandle(folderName, { create: true });
  const children = isLeaf ? null : node.children;
  if(children && children.length > 0){
    for(let i = 0; i < children.length; i++){
      await createFolderRecursive(dirHandle, children[i], [...path, i]);
    }
  }
  // Leere Ordner werden direkt angelegt; keine sichtbaren oder versteckten
  // Platzhalterdateien werden erzeugt.
}

async function exportTreeToDisk(sub){
  const btn = document.getElementById("btn-export-disk");
  const note = document.getElementById("export-status-note");
  if(!btn) return;

  if(!window.showDirectoryPicker){
    note.textContent = "Dieser Browser unterstützt das direkte Anlegen von Ordnern nicht (nur Chrome/Edge Desktop). Bitte stattdessen „Als ZIP exportieren“ nutzen.";
    note.style.display = "";
    return;
  }

  let rootHandle;
  try{
    rootHandle = await window.showDirectoryPicker({ mode: "readwrite" });
  } catch(err){
    if(err.name === "AbortError") return;
    note.textContent = "Ablageort konnte nicht ausgewählt werden: " + err.message;
    note.style.display = "";
    return;
  }

  const originalLabel = btn.textContent;
  btn.textContent = "Lege Ordner an …";
  btn.disabled = true;
  note.style.display = "none";
  try{
    const { gesellschaft, jahr } = getStammdaten();
    const projectName = sanitizeFileName(`Jahresabschluss ${jahr} ${gesellschaft}`);
    const projectHandle = await rootHandle.getDirectoryHandle(projectName, { create: true });
    for(let i = 0; i < sub.data.tree.length; i++){
      await createFolderRecursive(projectHandle, sub.data.tree[i], [i]);
    }
    note.textContent = `Ordnerstruktur angelegt in „${rootHandle.name}/${projectName}“.`;
    note.style.display = "";
  } catch(err){
    note.textContent = "Fehler beim Anlegen der Ordner: " + err.message;
    note.style.display = "";
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}

function kmMappingLabel(row){
  const parts = row.slice(0, 7).filter(v => v && v.trim() && v.trim() !== "(Leer)");
  return parts.length ? parts.join(" › ") : "(ohne Bezeichnung)";
}

function kmFormatNum(v){
  const n = parseFloat(v);
  if(isNaN(n)) return v || "";
  return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const KM_ROW_HEIGHT = 28;

function renderKontenMapping(){

  const mappingSub = findFirstSubOfType("mapping");

  const kmColumnDefs = [
    { key: "konto", label: "KontoNr" },

    { key: "bj", label: "Berichtsjahr", num: true },
    { key: "vj", label: "Vorjahr", num: true },
    { key: "zuord", label: "Ausweiszuordnung" }
  ];
  const kmVisibleDefs = kmColumnDefs.filter(c => !sub.data.hiddenColumns.has(c.key));
  const kmWidthOf = (key) => sub.data.columnWidths[key] || KM_DEFAULT_W[key] || 150;

  container.innerHTML = `
    <div class="km-card">
      <div class="km-toolbar">
        <input type="text" id="km-search" placeholder="Konto suchen (Nr. oder Bezeichnung)…" value="${sub.data.search}">
        <span class="km-count" id="km-count-label">${assignedCount} von ${susa.rowCount} Konten zugeordnet</span>
      </div>
      <div class="pbc-columns-row">
        <button class="btn-secondary" id="btn-km-reset-widths">Spaltenbreiten zurücksetzen</button>
        <button class="btn-secondary" id="btn-km-columns">Spalten</button>
        <div class="pbc-columns-panel" id="km-columns-panel" style="display:${sub.data.columnsPanelOpen ? "" : "none"};">

            <label class="pbc-columns-item">

            </label>
          `).join("")}
        </div>
      </div>
      <div class="km-wrap" id="km-wrap">
        <table class="km-table pbc-table-resizable">
          <colgroup>${kmVisibleDefs.map(c => `<col data-colkey="${c.key}" style="width:${kmWidthOf(c.key)}px;">`).join("")}</colgroup>
          <thead><tr>${kmVisibleDefs.map(c => `<th><span class="th-label">${c.label}</span><span class="col-resize-handle" data-colkey="${c.key}"></span></th>`).join("")}</tr></thead>

        </table>

        <button class="btn-save" id="btn-save-km">Speichern</button>

  });
  document.getElementById("btn-km-reset-widths").addEventListener("click", () => {
    sub.data.columnWidths = {};
    renderKontenMapping();
  });
  document.querySelectorAll('#km-columns-panel input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const key = e.target.dataset.col;
      if(e.target.checked) sub.data.hiddenColumns.delete(key);
      else sub.data.hiddenColumns.add(key);
      renderKontenMapping();
    });
  });

  const kmTableEl = container.querySelector(".km-table");
  container.querySelectorAll(".col-resize-handle").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const key = handle.dataset.colkey;
      const col = kmTableEl.querySelector(`col[data-colkey="${key}"]`);
      const startX = e.clientX;
      const startWidth = col.getBoundingClientRect().width;
      handle.classList.add("is-dragging");
      const onMove = (ev) => {
        const newWidth = Math.max(40, Math.round(startWidth + (ev.clientX - startX)));
        col.style.width = newWidth + "px";
      };
      const onUp = () => {
        sub.data.columnWidths[key] = parseInt(col.style.width, 10);
        handle.classList.remove("is-dragging");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);

  const wrap = document.getElementById("km-wrap");

      zuord: `<td class="${assignedVal !== undefined && assignedVal !== "" ? "assigned" : ""}"><select></select></td>`

    const select = tr.querySelector("select");
    if(select){

      select.value = assignedVal !== undefined ? assignedVal : "";

    }
    return tr;
  }

  function renderVisible(){
    const scrollTop = wrap.scrollTop;
    const viewportHeight = wrap.clientHeight || 600;
    const startIndex = Math.max(0, Math.floor(scrollTop / KM_ROW_HEIGHT) - buffer);
    const visibleCount = Math.ceil(viewportHeight / KM_ROW_HEIGHT) + buffer * 2;
    const endIndex = Math.min(rows.length, startIndex + visibleCount);

    body.innerHTML = "";
    const topSpacer = document.createElement("tr");
    topSpacer.style.height = (startIndex * KM_ROW_HEIGHT) + "px";
    topSpacer.innerHTML = `<td colspan="${kmColCount}" style="padding:0;border:none;"></td>`;
    body.appendChild(topSpacer);

    for(let i = startIndex; i < endIndex; i++){
      body.appendChild(makeRowTr(rows[i]));
    }

    const bottomSpacer = document.createElement("tr");
    bottomSpacer.style.height = ((rows.length - endIndex) * KM_ROW_HEIGHT) + "px";
    bottomSpacer.innerHTML = `<td colspan="${kmColCount}" style="padding:0;border:none;"></td>`;
    body.appendChild(bottomSpacer);
  }

  wrap.addEventListener("scroll", () => {
    if(!ticking){
      window.requestAnimationFrame(() => { renderVisible(); ticking = false; });
      ticking = true;
    }
  });

  renderVisible();

  document.getElementById("km-search").addEventListener("input", (e) => {
    sub.data.search = e.target.value;
    renderKontenMapping();
  });

  document.getElementById("btn-save-km").addEventListener("click", () => {
    sub.done = true;

  document.getElementById("btn-km-export").addEventListener("click", () => {

    const aoa = [["KontoNr", "Bezeichnung", "Berichtsjahr", "Vorjahr", "Ausweiszuordnung"]];
    susa.rows.forEach(r => {

      const label = (assignedIdx !== undefined && assignedIdx !== "" && mappingRows[assignedIdx]) ? kmMappingLabel(mappingRows[assignedIdx]) : "";
      aoa.push([r[0] || "", r[1] || "", r[2] || "", r[3] || "", label]);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, "Kontenzuordnung");
    XLSX.writeFile(wb, sanitizeFileName(`Kontenzuordnung ${jahr} ${gesellschaft}`) + ".xlsx");
    const note = document.getElementById("km-status-note");
    note.textContent = "Excel-Export gestartet.";

  });

  document.getElementById("btn-km-import").addEventListener("click", () => {
    document.getElementById("km-import-input").click();

    const file = e.target.files[0];
    if(!file) return;

    parseWorkbookFile(file, (err, result) => {
      if(err){
        note.textContent = "Datei konnte nicht gelesen werden: " + err.message;
        note.style.display = "";
        return;
      }
      const rawRows = result.rows.filter(rr => rr.some(c => c !== ""));
      const dataRows = rawRows.slice(1);
      const labelToIndex = {};
      mappingRows.forEach((r, i) => { labelToIndex[kmMappingLabel(r)] = i; });
      let matched = 0, unmatched = 0;
      dataRows.forEach(rr => {
        const kontoNr = String(rr[0] || "");
        const label = String(rr[4] || "").trim();
        if(!kontoNr || !label) return;
        if(labelToIndex.hasOwnProperty(label)){
          sub.data.assignments[kontoNr] = String(labelToIndex[label]);
          matched++;
        } else {
          unmatched++;
        }
      });
      renderKontenMapping();
      const note2 = document.getElementById("km-status-note");
      note2.textContent = `Import abgeschlossen: ${matched} Zuordnungen übernommen${unmatched ? `, ${unmatched} ohne passende Ausweisposition` : ""}.`;
      note2.style.display = "";
    });
    e.target.value = "";
  });
}

function buildStatementTree(){
  const importSub = findFirstSubOfType("import");
  const mappingSub = findFirstSubOfType("mapping");
  const kmSub = findFirstSubOfType("kontenmapping");
  if(!importSub || !importSub.data.imported || !mappingSub || !kmSub) return null;

  const susaRows = importSub.data.imported.rows;
  const mappingRows = mappingSub.data.rows;
  const assignments = kmSub.data.assignments;

  const byIdx = {};
  susaRows.forEach(r => {
    const kontoNr = String(r[0] || "");
    const idx = assignments[kontoNr];
    if(idx === undefined || idx === "") return;
    if(!byIdx[idx]) byIdx[idx] = [];
    byIdx[idx].push(r);
  });

  const root = { label: null, children: {}, accounts: [] };
  mappingRows.forEach((mrow, idx) => {
    const path = mrow.slice(0, 7).map(v => (v || "").toString().trim()).filter(v => v && v !== "(Leer)");
    let node = root;
    path.forEach(label => {
      if(!node.children[label]) node.children[label] = { label, children: {}, accounts: [] };
      node = node.children[label];
    });
    const accts = byIdx[idx] || [];
    node.accounts = node.accounts.concat(accts);
  });

  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  function sumUp(node){
    let sBj = node.accounts.reduce((a, r) => a + num(r[2]), 0);
    let sVj = node.accounts.reduce((a, r) => a + num(r[3]), 0);
    Object.values(node.children).forEach(child => {
      const s = sumUp(child);
      sBj += s.sumBerichtsjahr;
      sVj += s.sumVorjahr;
    });
    node.sumBerichtsjahr = sBj;
    node.sumVorjahr = sVj;
    return { sumBerichtsjahr: sBj, sumVorjahr: sVj };
  }
  sumUp(root);

  return root;
}

function renderStatementNode(node, path, depth, container, expandedSet){
  const childLabels = Object.keys(node.children);

  if(depth === 0){
    childLabels.forEach(label => renderStatementNode(node.children[label], [...path, label], depth + 1, container, expandedSet));
    return;
  }

  const key = path.join("|||");
  const isOpen = expandedSet.has(key);
  const hasContent = childLabels.length > 0 || node.accounts.length > 0;

  const row = document.createElement("div");
  row.className = "stmt-row" + (hasContent ? " has-children" : "") + (isOpen ? " is-open" : "");
  row.innerHTML = `
    <span class="stmt-label-cell" style="padding-left:${(depth - 1) * 20}px;">
      <span class="stmt-chevron${hasContent ? "" : " spacer"}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </span>
      <span class="tree-name">${node.label}</span>
    </span>
    <span class="stmt-num">${kmFormatNum(node.sumBerichtsjahr)}</span>
    <span class="stmt-num">${kmFormatNum(node.sumVorjahr)}</span>
  `;
  container.appendChild(row);

  const childWrap = document.createElement("div");
  childWrap.className = "tree-children" + (isOpen ? " is-open" : "");
  container.appendChild(childWrap);

  if(hasContent){
    row.addEventListener("click", () => {
      if(expandedSet.has(key)) expandedSet.delete(key); else expandedSet.add(key);
      renderStatement();
    });
  }

  if(isOpen){
    childLabels.forEach(label => renderStatementNode(node.children[label], [...path, label], depth + 1, childWrap, expandedSet));
    node.accounts.forEach(acc => {
      const accRow = document.createElement("div");
      accRow.className = "stmt-account";
      accRow.innerHTML = `
        <span class="stmt-account-label" style="padding-left:${depth * 20}px;">
          <span class="stmt-konto">${acc[0] || ""}</span>
          <span class="stmt-bez">${acc[1] || ""}</span>
        </span>
        <span class="stmt-num">${kmFormatNum(acc[2])}</span>
        <span class="stmt-num">${kmFormatNum(acc[3])}</span>
      `;
      childWrap.appendChild(accRow);
    });
  }
}

function flattenStatement(node, path, out){
  Object.keys(node.children).forEach(label => flattenStatement(node.children[label], [...path, label], out));
  node.accounts.forEach(acc => {
    const rowPath = [...path];
    while(rowPath.length < 7) rowPath.push("");
    out.push([...rowPath.slice(0, 7), acc[0] || "", acc[1] || "", acc[2] || "", acc[3] || ""]);
  });
}

function renderStatement(){
  const sub = stations[view.station].measures[view.measure].subitems[view.sub];
  const container = document.getElementById("form-container");
  const tree = buildStatementTree();

  if(!tree){
    container.innerHTML = `<div class="tree-card"><div class="km-empty-note">Es fehlen noch Daten: SuSa-Import, Berichtsstruktur und/oder Kontenzuordnung. Bitte zuerst die entsprechenden Kacheln befüllen.</div></div>`;
    return;
  }

  const rootKeys = Object.keys(tree.children);
  const isOpenState = anyRootLevelOpen(rootKeys, sub.data.expanded);
  const bjNear0 = Math.abs(tree.sumBerichtsjahr) < 0.01;
  const vjNear0 = Math.abs(tree.sumVorjahr) < 0.01;

  container.innerHTML = `
    <div class="tree-card">
      <div class="stmt-total-banner ${bjNear0 && vjNear0 ? "ok" : "warn"}">
        <span>Kontrollsumme Bilanz + GuV</span>
        <span class="stmt-total-nums">
          <span>Berichtsjahr: <strong>${kmFormatNum(tree.sumBerichtsjahr)}</strong></span>
          <span>Vorjahr: <strong>${kmFormatNum(tree.sumVorjahr)}</strong></span>
        </span>
      </div>
      <div class="tree-toolbar">
        <button class="tree-toggle-all" id="stmt-toggle-all">${isOpenState ? "Alle zuklappen" : "Alle aufklappen"}</button>
      </div>
      <div class="stmt-header-row">
        <span>Bezeichnung</span><span>Berichtsjahr</span><span>Vorjahr</span>
      </div>
      <div class="stmt-list-wrap"><div id="stmt-list"></div></div>
      <div class="km-actions">
        <button class="btn-secondary" id="btn-stmt-export">Excel Export</button>
        <button class="btn-secondary" id="btn-stmt-import">Excel Import</button>
        <input type="file" id="stmt-import-input" accept=".xlsx,.xls" style="display:none;">
        <span class="form-saved-note" id="stmt-status-note" style="display:none;"></span>
      </div>
    </div>
  `;

  const list = document.getElementById("stmt-list");
  renderStatementNode(tree, [], 0, list, sub.data.expanded);

  document.getElementById("stmt-toggle-all").addEventListener("click", () => {
    if(isOpenState){
      sub.data.expanded.clear();
    } else {
      const collect = (node, path) => {
        Object.keys(node.children).forEach(label => {
          const childPath = [...path, label];
          sub.data.expanded.add(childPath.join("|||"));
          collect(node.children[label], childPath);
        });
      };
      collect(tree, []);
    }
    renderStatement();
  });

  document.getElementById("btn-stmt-export").addEventListener("click", () => {
    const { gesellschaft, jahr } = getStammdaten();
    const flat = [];
    flattenStatement(tree, [], flat);
    const aoa = [["Ausweis_1", "Ausweis_2", "Ausweis_3", "Ausweis_4", "Ausweis_5", "Ausweis_6", "Ausweis_7", "KontoNr", "Bezeichnung", "Berichtsjahr", "Vorjahr"], ...flat];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, "Bilanz & GuV");
    XLSX.writeFile(wb, sanitizeFileName(`Bilanz und GuV ${jahr} ${gesellschaft}`) + ".xlsx");
    const note = document.getElementById("stmt-status-note");
    note.textContent = "Excel-Export gestartet.";
    note.style.display = "";
  });

  document.getElementById("btn-stmt-import").addEventListener("click", () => {
    document.getElementById("stmt-import-input").click();
  });

  document.getElementById("stmt-import-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const note = document.getElementById("stmt-status-note");
    const mappingSub = findFirstSubOfType("mapping");
    const kmSub = findFirstSubOfType("kontenmapping");
    parseWorkbookFile(file, (err, result) => {
      if(err){
        note.textContent = "Datei konnte nicht gelesen werden: " + err.message;
        note.style.display = "";
        return;
      }
      const rawRows = result.rows.filter(rr => rr.some(c => c !== ""));
      const dataRows = rawRows.slice(1);
      const labelToIndex = {};
      mappingSub.data.rows.forEach((r, i) => { labelToIndex[kmMappingLabel(r)] = i; });
      let matched = 0, unmatched = 0;
      dataRows.forEach(rr => {
        const ausweisFields = rr.slice(0, 7);
        const kontoNr = String(rr[7] || "");
        if(!kontoNr) return;
        const label = kmMappingLabel(ausweisFields);
        if(labelToIndex.hasOwnProperty(label)){
          kmSub.data.assignments[kontoNr] = String(labelToIndex[label]);
          matched++;
        } else {
          unmatched++;
        }
      });
      renderStatement();
      const note2 = document.getElementById("stmt-status-note");
      note2.textContent = `Import abgeschlossen: ${matched} Zuordnungen übernommen${unmatched ? `, ${unmatched} ohne passende Ausweisposition` : ""}.`;
      note2.style.display = "";
    });
    e.target.value = "";
  });
}

function msStatus(m){
  if(m.done) return { label: "Erledigt", cls: "ok" };
  if(m.date){
    const today = new Date().toISOString().slice(0, 10);
    if(m.date < today) return { label: "Überfällig", cls: "overdue" };
  }
  return { label: "Offen", cls: "open" };
}

function formatDateDE(iso){
  if(!iso) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}

function parseDateAnyToISO(str){
  if(!str) return "";
  const s = String(str).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s);
  if(m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}

function getStichtagISO(){
  let data = null;
  stations.forEach(s => s.measures.forEach(m => m.subitems.forEach(sub => {
    if(sub.fields && sub.fields.some(f => f.key === "firmierung")) data = sub.data;
  })));
  return data && data.stichtag ? data.stichtag : "";
}

function isoToUTCDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  if(!m) return null;
  return new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
}

function utcDateToISO(date){
  return date.toISOString().slice(0, 10);
}

function addDaysFromStichtagISO(days){
  const stichtag = getStichtagISO();
  if(!stichtag) return "";
  const d = isoToUTCDate(stichtag);
  if(!d) return "";
  d.setUTCDate(d.getUTCDate() + (Number(days) || 0));
  return utcDateToISO(d);
}

function diffDaysFromStichtagISO(iso){
  const stichtag = getStichtagISO();
  if(!stichtag || !iso) return "";
  const d1 = isoToUTCDate(stichtag);
  const d2 = isoToUTCDate(iso);
  if(!d1 || !d2) return "";
  return Math.round((d2 - d1) / 86400000);
}

const WEEKDAY_NAMES_DE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

function weekdayDE(iso){
  if(!iso) return "";
  const d = isoToUTCDate(iso);
  if(!d || isNaN(d.getTime())) return "";
  return WEEKDAY_NAMES_DE[d.getUTCDay()];
}

function isWeekendISO(iso){
  if(!iso) return false;
  const d = isoToUTCDate(iso);
  if(!d) return false;
  const day = d.getUTCDay();
  return day === 0 || day === 6;
}

function addDaysISO(iso, days){
  const d = isoToUTCDate(iso);
  if(!d) return "";
  d.setUTCDate(d.getUTCDate() - days);
  return utcDateToISO(d);
}

function getAnchorMilestone(type){
  const sub = findFirstSubOfType("milestones");
  if(!sub) return null;
  return sub.data.milestones.find(m => m.verknuepfung === type) || null;
}

function computeLiefertermDate(liefertermin){
  let type = "", isVor = false;
  if(liefertermin === "Vorprüfung"){ type = "vorpruefung"; }
  else if(liefertermin === "Vor der Vorprüfung"){ type = "vorpruefung"; isVor = true; }
  else if(liefertermin === "Hauptprüfung"){ type = "hauptpruefung"; }
  else if(liefertermin === "Vor der Hauptprüfung"){ type = "hauptpruefung"; isVor = true; }
  else return "";
  const anchor = getAnchorMilestone(type);
  if(!anchor || !anchor.date) return "";
  if(!isVor) return anchor.date;
  const offset = Number(anchor.offsetTage) || 30;
  return addDaysISO(anchor.date, offset);
}

function computeRowEffectiveDatum(row){
  if(row[10]) return row[10];
  if(row[11] !== undefined && row[11] !== "" && row[11] !== null){
    const d = addDaysFromStichtagISO(row[11]);
    if(d) return d;
  }
  const msSub = findFirstSubOfType("milestones");
  if(msSub){
    const m = msSub.data.milestones.find(x => x.name === row[8]);
    if(m && m.date) return m.date;
  }
  const legacy = computeLiefertermDate(row[8]);
  if(legacy) return legacy;
  return "";
}

function serializeStations(){
  return JSON.stringify(stations, (key, value) => {
    if(value instanceof Set) return { __isSet: true, values: [...value] };
    return value;
  }, 2);
}

function deserializeStations(text){
  return JSON.parse(text, (key, value) => {
    if(value && typeof value === "object" && value.__isSet) return new Set(value.values);
    return value;
  });
}

function showTopNote(message, isError){
  const note = document.getElementById("top-export-note");
  note.textContent = message;
  note.className = "top-export-note" + (isError ? " is-error" : "");
  note.style.display = "";
}

function exportStateAsJson(){
  try{
    const { gesellschaft, jahr } = getStammdaten();
    const filename = sanitizeFileName(`Abschluss-Cockpit ${jahr} ${gesellschaft}`) + ".json";
    const blob = new Blob([serializeStations()], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showTopNote(`Stand exportiert: ${filename}`, false);
  } catch(err){
    showTopNote("Export fehlgeschlagen: " + err.message, true);
  }
}

function importStateFromJsonText(text){
  try{
    const imported = deserializeStations(text);
    if(!Array.isArray(imported)) throw new Error("Datei enthält keine gültige Cockpit-Struktur.");
    stations.splice(0, stations.length, ...imported);
    view = { level: "grid" };
    openMeasure = null;
    render();
    showTopNote("Stand erfolgreich importiert.", false);
  } catch(err){
    showTopNote("Import fehlgeschlagen: " + err.message, true);
  }
}

function findFirstSubOfType(type){
  let found = null;
  stations.forEach(s => s.measures.forEach(m => m.subitems.forEach(sub => {
    if(!found && sub.type === type) found = sub;
  })));
  return found;
}

function getRoleCatalog(){
  const rolesSub = findFirstSubOfType("roles");
  return rolesSub ? rolesSub.data.roles : [];
}

function resolveRoleName(abteilung){
  if(!abteilung) return "";
  const roles = getRoleCatalog();
  const match = roles.find(r => r.role === abteilung);
  if(!match) return "";
  const name = [match.vorname, match.nachname].filter(Boolean).join(" ").trim();
  return name;
}

// Letzte Absicherung: Kacheln mit identischem Ordnernamen würden im
// Dateisystem zu einem Ordner verschmelzen. Ein Zusatz hält jede Kachel
// als eigenen Ordner erhalten.
function dedupeProjectFolderNames(children){
  const seen = new Map();
  children.forEach(child => {
    const count = (seen.get(child.name) || 0) + 1;
    seen.set(child.name, count);
    if(count > 1) child.name = sanitizeFileName(`${child.name} (${count})`);
  });
}

// Ordnerstruktur des Dashboards - eine Quelle für Datenraum-Modal und Projektordner-Export.
//
// Gespeist wird sie aus process_steps (parent_id-Kette), nicht mehr aus stations/measures.
// Damit zeigen Kacheln und Ordnerbaum dieselbe Hierarchie, auch in der vierten Ebene
// (3.13.1.1 ...). Vorher waren es zwei Bäume, die dieselbe Sache unterschiedlich tief
// abbildeten - genau die Doppelung, die beim Datenraum schon einmal aufgefallen ist.
//
// Der Name bleibt bewusst "<code>. <name>", identisch zu den bisherigen Kachel-Titeln:
// so ändert sich für alle bestehenden Ordner kein einziges Zeichen, es kommen nur die
// neuen Ebenen hinzu. Ohne geladene process_steps (Offline-/Legacy-Nutzung der Datei)
// greift der bisherige State-Pfad als Rückfall.
function processStepFolderName(step){
  return `${step.code}. ${step.name}`.trim();
}
function buildProcessStepFolderNode(step){
  return {
    name: sanitizeFileName(processStepFolderName(step) || "Kachel"),
    code: step.code,
    stepId: step.id,
    children: processStepChildren(step.id).map(buildProcessStepFolderNode)
  };
}
function buildProjectFolderModel(){
  const roots = processStepsByParent.get("root") || [];
  const nodes = roots.length
    ? roots.map(buildProcessStepFolderNode)
    : stations.map(station => ({
        name: sanitizeFileName(station.title || "Station"),
        children: (station.measures || []).map(measure => ({ name: sanitizeFileName(measure.title || "Kachel"), children: [] }))
      }));
  const dedupeTiefe = node => { dedupeProjectFolderNames(node.children || []); (node.children || []).forEach(dedupeTiefe); };
  nodes.forEach(dedupeTiefe);
  const zaehle = list => (list || []).reduce((sum, node) => sum + 1 + zaehle(node.children), 0);
  return {
    nodes,
    stationCount: nodes.length,
    measureCount: nodes.reduce((sum, node) => sum + zaehle(node.children), 0)
  };
}

async function createSimpleFolderRecursive(parentHandle, node){
  const dirHandle = await parentHandle.getDirectoryHandle(node.name, { create: true });
  for(const child of node.children || []){
    await createSimpleFolderRecursive(dirHandle, child);
  }
}

function buildSimpleZipFolder(zipFolder, node){
  const sub = zipFolder.folder(node.name);
  (node.children || []).forEach(child => buildSimpleZipFolder(sub, child));
}

async function saveProjectFolderFromToolbar(){
  const model = buildProjectFolderModel();
  if(!model.measureCount){
    showTopNote("Im Cockpit sind noch keine Kacheln vorhanden, aus denen ein Projektordner erzeugt werden könnte.", true);
    return;
  }
  const { gesellschaft, jahr } = getStammdaten();
  const projectName = sanitizeFileName(`Jahresabschluss ${jahr} ${gesellschaft}`);
  const summary = `${model.stationCount} Stationsordner, ${model.measureCount} Kachelordner`;

  if(!window.showDirectoryPicker){
    try{
      const zip = new JSZip();
      model.nodes.forEach(node => buildSimpleZipFolder(zip, node));
      const blob = await zip.generateAsync({ type: "blob" });
      const filename = projectName + ".zip";
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showTopNote(`Dieser Browser unterstützt das direkte Anlegen von Ordnern nicht (nur Chrome/Edge Desktop). ZIP heruntergeladen: ${filename} (${summary}).`, false);
    } catch(err){
      showTopNote("ZIP konnte nicht erzeugt werden: " + err.message, true);
    }
    return;
  }

  let rootHandle;
  try{
    rootHandle = await window.showDirectoryPicker({ mode: "readwrite" });
  } catch(err){
    if(err.name === "AbortError") return;
    showTopNote("Ablageort konnte nicht ausgewählt werden: " + err.message, true);
    return;
  }
  try{
    const projectHandle = await rootHandle.getDirectoryHandle(projectName, { create: true });
    for(const node of model.nodes){
      await createSimpleFolderRecursive(projectHandle, node);
    }
    showTopNote(`Projektordner angelegt in „${rootHandle.name}/${projectName}“ (${summary}).`, false);
  } catch(err){
    showTopNote("Fehler beim Anlegen der Ordner: " + err.message, true);
  }
}

const LUMINA_STORAGE_KEY = "lumina_abschluss_cockpit_explorer_v1";

function luminaNow(){ return new Date().toISOString(); }
function luminaEsc(v){ return String(v ?? "").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function luminaId(){ return "task-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9); }
function ensureTaskState(d,row,ri){
  if(!row[12]) row[12]=luminaId();
  if(!d.taskStates) d.taskStates={};
  if(!d.taskStates[row[12]]) d.taskStates[row[12]]={workStatus:"Offen",reviewStatus:"Ungeprüft",submissions:[],documents:[],folderPath:"",activities:[{at:luminaNow(),text:"Aufgabe im Cockpit angelegt"}],sentAt:"",remindedAt:""};
  if(!Array.isArray(d.taskStates[row[12]].documents)) d.taskStates[row[12]].documents=[];
  if(typeof d.taskStates[row[12]].folderPath!=="string") d.taskStates[row[12]].folderPath="";
  return d.taskStates[row[12]];
}
function getPbcSub(){ return findFirstSubOfType("pbc"); }
function getRole(role){ return getRoleCatalog().find(r=>r.role===role)||{}; }
function taskEffectiveDate(row){ try{return computeRowEffectiveDatum(row)||""}catch(e){return row[10]||""} }
function taskTiming(row,state){ const iso=taskEffectiveDate(row); if(!iso||["Abgeschlossen","Nicht relevant"].includes(state.workStatus)) return "Im Plan"; const today=new Date(); today.setHours(0,0,0,0); const due=new Date(iso+"T00:00:00"); const days=Math.round((due-today)/86400000); return days<0?"Überfällig":days===0?"Heute fällig":days<=7?"Bald fällig":"Im Plan"; }
function taskStats(){ const sub=getPbcSub(); const s={open:0,wip:0,submitted:0,review:0,overdue:0,done:0,total:0}; if(!sub)return s; sub.data.rows.forEach((row,ri)=>{const st=ensureTaskState(sub.data,row,ri);s.total++; if(st.workStatus==="Offen"||st.workStatus==="Angenommen")s.open++; if(st.workStatus==="In Bearbeitung")s.wip++; if(st.workStatus==="Eingereicht")s.submitted++; if(st.workStatus==="Eingereicht"&&st.reviewStatus!=="Akzeptiert")s.review++; if(taskTiming(row,st)==="Überfällig")s.overdue++; if(st.workStatus==="Abgeschlossen"||st.workStatus==="Nicht relevant")s.done++;}); return s; }
function scheduleLuminaSave(){ clearTimeout(luminaSaveTimer); const el=document.getElementById("autosave-indicator"); if(el){el.textContent="Änderungen…";el.classList.remove("saved");} luminaSaveTimer=setTimeout(saveLuminaLocal,450); }
function saveLuminaLocal(){ try{localStorage.setItem(LUMINA_STORAGE_KEY,serializeStations()); const el=document.getElementById("autosave-indicator");if(el){el.textContent="Automatisch gespeichert · "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});el.classList.add("saved");}}catch(e){showTopNote("Lokales Speichern fehlgeschlagen: "+e.message,true);} }
function restoreLuminaLocal(){ try{const raw=localStorage.getItem(LUMINA_STORAGE_KEY);if(!raw)return false;const imported=deserializeStations(raw);if(Array.isArray(imported)){stations.splice(0,stations.length,...imported);return true;}}catch(e){console.warn("Autosave konnte nicht geladen werden",e)}return false; }
function addActivity(st,text){st.activities=st.activities||[];st.activities.unshift({at:luminaNow(),text});scheduleLuminaSave();}
function formatDateTime(iso){try{return new Date(iso).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}catch(e){return iso}}
function responsible(row){const r=getRole(row[4]);return {name:[r.vorname,r.nachname].filter(Boolean).join(" ")||row[4]||"Nicht zugeordnet",email:r.email||""};}
function taskDataRoomLinks(st){return (st.submissions||[]).filter(x=>x&&x.type==='Link'&&x.url).map(x=>x.url.trim()).filter(Boolean);}
function taskPrimaryDataRoomLink(st){return st.dataRoomUrl||taskDataRoomLinks(st)[0]||'';}
function recipientDataRoomLoginLink(row,st,email){
  const direct=taskPrimaryDataRoomLink(st);if(!direct||!email)return direct;
  try{
    const target=new URL(direct,LUMINA_PUBLIC_APP_URL);
    target.searchParams.set('task',String(row[0]||target.searchParams.get('task')||''));
    target.searchParams.set('view','dataroom');
    target.searchParams.set('email',email);
    const login=new URL('/login',target.origin);
    login.searchParams.set('email',email);
    login.searchParams.set('next',target.pathname+target.search);
    return login.toString();
  }catch(error){return direct;}
}

// Der Datenraum folgt derselben festen Struktur wie der Projektordner-Export:
// 1 Hauptordner je Station, darin 1 Unterordner je Kachel aus station.measures.
// Der Baum wird zur Laufzeit aus stations abgeleitet und bleibt damit
// automatisch synchron; sub.data.tree wird nicht mehr gelesen und nicht
// verändert. Bestehende folderPath-Zuordnungen, die auf die alte Struktur
// zeigen, fängt ensureExplorerFolder() über seinen Default ab.
function getDataroomTree(){return buildProjectFolderModel().nodes;}
function explorerNodeName(node){return typeof node==="string"?node:(node?.name||"Ordner");}
function explorerNodeChildren(node){return typeof node==="string"?[]:(Array.isArray(node?.children)?node.children:[]);}
// Schlüssel ist der Prozessschritt-Code ("3.13.1.1"), nicht mehr die Array-Position.
// Ein Positionsschlüssel zeigt nach jeder Umsortierung stillschweigend auf einen anderen
// Ordner; der Code überlebt Umsortierung und neue Ebenen. Fällt der Baum auf den
// State-Pfad zurück (ohne code), bleibt es beim bisherigen Positionsschlüssel.
function flattenDataroomFolders(){const out=[];const walk=(nodes,parentPath=[],parentNames=[])=>{(nodes||[]).forEach((node,i)=>{const path=[...parentPath,i],names=[...parentNames,explorerNodeName(node)];out.push({key:node.code||path.join('.'),path,names,name:names[names.length-1],depth:path.length-1,stepId:node.stepId||null});walk(explorerNodeChildren(node),path,names);});};walk(getDataroomTree());return out;}
function explorerFolderByKey(key){const all=flattenDataroomFolders();return all.find(x=>x.key===key)||all[0]||{key:"",path:[],names:["Datenraum"],name:"Datenraum",depth:0};}
function ensureExplorerFolder(st){const all=flattenDataroomFolders();if(!st.folderPath||!all.some(x=>x.key===st.folderPath))st.folderPath=all[0]?.key||"";return explorerFolderByKey(st.folderPath);}

/* ---------- Zentraler Datenraum: kein Aufgabenbezug ----------
   openDashboardDataroom setzt activeTaskContext auf {ri:0, globalRoom:true} - eine
   Platzhalter-Zeile, damit renderTaskModal ueberhaupt laeuft. Alles, was der
   Arbeitsbereich sonst am Task-State aendert, traf dadurch die Aufgabe, die zufaellig
   PBC-Zeile 0 ist (#165, "1.0. Pruefungsauftrag & Mandatierung allgemein"):
     - Ordner-Klick schrieb folderPath und einen Verlaufseintrag dorthin,
     - "Aufgabe hier zuordnen" ebenso,
     - und "Im Datenraum ablegen" haette die Datei per prepare_document_upload an #165
       gehaengt, deren Status auf "Eingereicht" gesetzt und das nach Supabase gespeichert.
   Der letzte Fall war kein reiner Anzeigefehler mehr.

   Die Ordnerauswahl gehoert deshalb an den Modus statt an eine Aufgabe. Ablegen und
   Zuordnen entfallen im zentralen Datenraum ganz: ohne gewaehlte Massnahme gibt es kein
   richtiges Ziel, und ein falsches Ziel ist schlechter als kein Knopf. Sie kommen zurueck,
   sobald ein Klick auf eine Blattkachel das Aufgaben-Modal oeffnet. */
let globalRoomFolderKey="";
function explorerIsGlobalRoom(){ return !!(activeTaskContext&&activeTaskContext.globalRoom); }
function explorerCurrentFolder(st){
  if(!explorerIsGlobalRoom()) return ensureExplorerFolder(st);
  const all=flattenDataroomFolders();
  if(!globalRoomFolderKey||!all.some(x=>x.key===globalRoomFolderKey)) globalRoomFolderKey=all[0]?.key||"";
  return explorerFolderByKey(globalRoomFolderKey);
}
function explorerSelectFolder(st,key){
  if(explorerIsGlobalRoom()){ globalRoomFolderKey=key; return; }
  st.folderPath=key;
  addActivity(st,`Datenraumordner ausgewählt: ${explorerFolderByKey(key).names.join(' / ')}`);
}
function allExplorerDocuments(){const sub=getPbcSub(),out=[];if(!sub)return out;(sub.data.rows||[]).forEach((row,ri)=>{const st=ensureTaskState(sub.data,row,ri);(st.documents||[]).forEach(doc=>out.push({...doc,_state:st,_row:row,_ri:ri,_taskId:row[12]}));});return out;}
function explorerDocsInFolder(key){return allExplorerDocuments().filter(d=>d.folderPath===key);}
function explorerFormatBytes(n){const v=Number(n)||0;if(!v)return "–";if(v<1024)return v+" B";if(v<1048576)return (v/1024).toFixed(1)+" KB";return (v/1048576).toFixed(1)+" MB";}
function explorerFileKind(doc){const n=(doc.name||"").toLowerCase();if(n.endsWith('.pdf'))return 'PDF';if(/\.(xlsx?|csv)$/.test(n))return 'XLS';if(/\.(docx?)$/.test(n))return 'DOC';if(/\.(png|jpe?g|gif|webp)$/.test(n))return 'IMG';return 'FILE';}
async function explorerDownload(doc){try{if(doc.storagePath){showTopNote('Dokument wird geladen ...');const {data,error}=await luminaDb.storage.from(doc.storageBucket||'lumina-datarooms').download(doc.storagePath);if(error)throw error;const objectUrl=URL.createObjectURL(data),a=document.createElement('a');a.href=objectUrl;a.download=doc.name||'Dokument';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),30000);showTopNote('Dokument heruntergeladen.');return;}if(doc.dataUrl){const a=document.createElement('a');a.href=doc.dataUrl;a.download=doc.name||'Dokument';document.body.appendChild(a);a.click();a.remove();return;}if(doc.url){window.open(doc.url,'_blank','noopener');return;}showTopNote('Für diese Metadatei ist kein Dateiinhalt gespeichert.',true);}catch(error){showTopNote('Dokument konnte nicht geladen werden: '+(error.message||error),true);}}
function explorerRemoveDocument(doc){if(doc.persisted){showTopNote('Das dauerhafte Löschen wird separat freigeschaltet. Das Dokument bleibt sicher in Supabase gespeichert.',true);return;}if(!confirm(`Dokument „${doc.name}“ entfernen?`))return;const list=doc._state.documents||[];const idx=list.findIndex(x=>x.id===doc.id);if(idx>=0)list.splice(idx,1);addActivity(doc._state,`Dokument entfernt: ${doc.name}`);renderTaskModal();}
async function explorerAddDocument(st,row){const file=document.getElementById('explorer-file')?.files?.[0],url=(document.getElementById('explorer-url')?.value||'').trim(),name=(document.getElementById('explorer-name')?.value||'').trim(),comment=(document.getElementById('explorer-comment')?.value||'').trim(),folder=ensureExplorerFolder(st);if(!file&&!url){showTopNote('Bitte eine Datei auswählen oder einen Link eingeben.',true);return;}if(url&&!/^https?:\/\//i.test(url)){showTopNote('Bitte einen gültigen Link eingeben.',true);return;}if(!file){const doc={id:'link-'+Date.now().toString(36),name:name||url,size:0,mime:'link',url,comment,folderPath:folder.key,taskId:row[12],taskNumber:row[0]||'',taskTitle:row[3]||row[1]||'',uploadedAt:luminaNow(),version:1};st.documents.push(doc);addActivity(st,`Externer Link im Datenraum abgelegt: ${doc.name}`);renderTaskModal();return;}if(!st.remoteTaskId){showTopNote('Diese Aufgabe ist noch keinem Supabase-Datensatz zugeordnet.',true);return;}const button=document.getElementById('explorer-save-document');if(button){button.disabled=true;button.textContent='Wird hochgeladen ...';}let prepared=null;try{const {data,error}=await luminaDb.rpc('prepare_document_upload',{p_task_id:st.remoteTaskId,p_original_file_name:file.name,p_mime_type:file.type||'application/octet-stream',p_file_size:file.size,p_upload_comment:comment||null});if(error)throw error;prepared=Array.isArray(data)?data[0]:data;if(!prepared?.storage_path)throw new Error('Supabase hat keinen Speicherpfad geliefert.');const {error:uploadError}=await luminaDb.storage.from(prepared.storage_bucket||'lumina-datarooms').upload(prepared.storage_path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(uploadError)throw uploadError;st.documents.push({id:prepared.document_id,remoteDocumentId:prepared.document_id,remoteVersionId:prepared.version_id,name:file.name,size:file.size,mime:file.type||'application/octet-stream',comment,folderPath:folder.key,taskId:row[12],taskNumber:row[0]||'',taskTitle:row[3]||row[1]||'',uploadedAt:luminaNow(),version:1,storageBucket:prepared.storage_bucket||'lumina-datarooms',storagePath:prepared.storage_path,persisted:true});st.workStatus='Eingereicht';addActivity(st,`Dokument dauerhaft in Supabase abgelegt: ${file.name}`);try{await saveLuminaTaskToSupabase(row,st);}catch(statusError){console.warn('Status konnte nicht gespeichert werden',statusError);}showTopNote('Dokument dauerhaft gespeichert.');renderTaskModal();}catch(error){if(prepared?.document_id)await luminaDb.rpc('cancel_document_upload',{p_document_id:prepared.document_id});showTopNote('Upload fehlgeschlagen: '+(error.message||error),true);if(button){button.disabled=false;button.textContent='Im Datenraum ablegen';}}}

function getNodeAtPath(nodes,path){let list=nodes,node=null;for(const idx of path){node=list?.[idx];if(node==null)return null;list=explorerNodeChildren(node);}return node;}
let explorerExpandedFolders=new Set();
function renderExplorerTreeNodes(nodes,parentPath=[],depth=0,selectedKey=""){
  return (nodes||[]).map((node,i)=>{
    const path=[...parentPath,i],key=path.join('.'),name=explorerNodeName(node),children=explorerNodeChildren(node),hasChildren=children.length>0,isOpen=explorerExpandedFolders.has(key);
    return `<div class="explorer-folder-node"><button class="explorer-folder ${key===selectedKey?'active':''} ${isOpen?'is-open':''}" data-folder="${luminaEsc(key)}" data-has-children="${hasChildren?'1':'0'}" style="padding-left:${8+depth*14}px"><span class="explorer-folder-icon">${hasChildren?'▸':'·'}</span><span title="${luminaEsc(name)}">${luminaEsc(name)}</span></button>${hasChildren?`<div class="explorer-folder-children ${isOpen?'is-open':''}">${renderExplorerTreeNodes(children,path,depth+1,selectedKey)}</div>`:''}</div>`;
  }).join('');
}
function renderExplorerRoom(row,st){const global=explorerIsGlobalRoom();const folders=flattenDataroomFolders(),folder=explorerCurrentFolder(st),docs=explorerDocsInFolder(folder.key);const tree=renderExplorerTreeNodes(getDataroomTree(),[],0,folder.key);const rows=docs.map(doc=>`<div class="explorer-row"><div class="explorer-file-name"><div class="explorer-file-icon">${explorerFileKind(doc)}</div><div class="explorer-file-text"><div class="explorer-file-title" title="${luminaEsc(doc.name)}">${luminaEsc(doc.name)}</div><div class="explorer-file-sub">Aufgabe ${luminaEsc(doc.taskNumber||'–')} · ${luminaEsc(doc.comment||doc.taskTitle||'')}</div></div></div><div>${luminaEsc(doc.taskNumber||'–')}</div><div>V${luminaEsc(doc.version||1)}</div><div>${formatDateTime(doc.uploadedAt)}</div><div class="explorer-actions"><button class="explorer-action" data-download="${luminaEsc(doc.id)}">Öffnen</button><button class="explorer-action danger" data-remove="${luminaEsc(doc.id)}">×</button></div></div>`).join('');return `<div class="explorer-shell"><aside class="explorer-tree"><div class="explorer-tree-head"><div class="explorer-tree-title">Ordnerstruktur</div><div class="explorer-tree-controls"><button class="explorer-tree-control" id="explorer-expand-all">Alle aufklappen</button><button class="explorer-tree-control" id="explorer-collapse-all">Alle zuklappen</button></div></div>${tree||'<div class="explorer-empty">Keine Ordnerstruktur vorhanden.</div>'}</aside><section class="explorer-main"><div class="explorer-head"><div class="explorer-breadcrumb">${luminaEsc(folder.names.slice(0,-1).join(' › ')||'Datenraum')}<strong>${luminaEsc(folder.name)}</strong></div><div class="explorer-toolbar">${global?'':`<button class="btn-secondary" id="explorer-assign-folder">Aufgabe hier zuordnen</button><button class="btn-save" id="explorer-toggle-upload">Dokument hinzufügen</button>`}</div></div><div class="explorer-assignment">${global?`<span>Zentraler Datenraum — Ablegen erfolgt in der jeweiligen Maßnahme.</span>`:`<span>Diese Aufgabe ist dem Ordner <b>${luminaEsc(folder.names.join(' › '))}</b> zugeordnet.</span>`}<span>${docs.length} Dokument${docs.length===1?'':'e'} im Ordner</span></div>${global?'':`<div class="explorer-upload" id="explorer-upload"><div class="task-field"><label>Datei</label><input id="explorer-file" type="file"></div><div class="task-field"><label>oder externer Link</label><input id="explorer-url" type="url" placeholder="https://..."></div><div class="task-field span-2"><label>Anzeigename bei Link</label><input id="explorer-name" type="text" placeholder="z. B. Anlagenspiegel 2026"></div><div class="task-field span-2"><label>Kommentar</label><input id="explorer-comment" type="text" placeholder="optional"></div><div class="explorer-upload-actions"><button class="btn-secondary" id="explorer-cancel-upload">Abbrechen</button><button class="btn-save" id="explorer-save-document">Im Datenraum ablegen</button></div></div>`}<div class="explorer-list"><div class="explorer-row head"><div>Name</div><div>Aufgabe</div><div>Version</div><div>Hochgeladen</div><div>Aktion</div></div>${rows||(global?'<div class="explorer-empty"><strong>Noch keine Dokumente</strong>In diesem Ordner liegt noch nichts.</div>':'<div class="explorer-empty"><strong>Noch keine Dokumente</strong>Fügen Sie für diesen Ordner eine Datei oder einen Link hinzu.</div>')}</div><div class="dropbox-room-note"><strong>Dauerhaft gespeichert:</strong> Hochgeladene Dateien liegen im privaten Supabase-Datenraum und werden nach jeder Anmeldung erneut geladen.</div></section></div>`;}
function bindExplorerRoom(row,st){document.querySelectorAll('.explorer-folder').forEach(b=>b.onclick=()=>{const key=b.dataset.folder,hasChildren=b.dataset.hasChildren==='1';if(hasChildren){if(explorerExpandedFolders.has(key))explorerExpandedFolders.delete(key);else explorerExpandedFolders.add(key);}explorerSelectFolder(st,key);renderTaskModal();});const expandAll=document.getElementById('explorer-expand-all');if(expandAll)expandAll.onclick=()=>{flattenDataroomFolders().forEach(f=>{if(explorerNodeChildren(getNodeAtPath(getDataroomTree(),f.path)).length)explorerExpandedFolders.add(f.key);});renderTaskModal();};const collapseAll=document.getElementById('explorer-collapse-all');if(collapseAll)collapseAll.onclick=()=>{explorerExpandedFolders.clear();renderTaskModal();};const toggle=document.getElementById('explorer-toggle-upload'),box=document.getElementById('explorer-upload');if(toggle&&box)toggle.onclick=()=>box.classList.toggle('open');const cancel=document.getElementById('explorer-cancel-upload');if(cancel&&box)cancel.onclick=()=>box.classList.remove('open');const save=document.getElementById('explorer-save-document');if(save&&!explorerIsGlobalRoom())save.onclick=()=>explorerAddDocument(st,row);const assign=document.getElementById('explorer-assign-folder');if(assign&&!explorerIsGlobalRoom())assign.onclick=()=>{addActivity(st,`Aufgabe dem Datenraumordner zugeordnet: ${ensureExplorerFolder(st).names.join(' / ')}`);showTopNote('Ordnerzuordnung gespeichert.');renderTaskModal();};const docs=allExplorerDocuments();document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.download);if(d)explorerDownload(d);});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.remove);if(d)explorerRemoveDocument(d);});}

function openPbcWithStatusFilter(filter){

  sub.data.filters.taskStatus=filter||"";
  sub.data.filters.lfdNr="";
  sub.data.filters.search="";
  sub.data.filters.prozessschritt="";
  sub.data.filters.kategorie="";
  sub.data.filters.abteilung="";
  sub.data.filters.liefertermin="";
  for(let si=0;si<stations.length;si++){
    for(let mi=0;mi<stations[si].measures.length;mi++){
      for(let ui=0;ui<stations[si].measures[mi].subitems.length;ui++){
        if(stations[si].measures[mi].subitems[ui]===sub){

}

/* ---------- Zweiter Anker des Aufgaben-Modals: der Prozessschritt ----------
   Bewusst abgeleitet statt mitgefuehrt. tasks.process_step_id liegt seit dem
   Kachelumbau in jedem Task-State; ein zweites Feld im activeTaskContext waere
   ein Merker, der auseinanderlaufen kann - dieselbe Ueberlegung wie bei der
   Kinder-Weiche. Beide Wege ("Mein Tag" und Klick auf eine Blattkachel) landen
   damit zwangslaeufig beim selben Schritt. */
function taskContextStepId(){
  if(!activeTaskContext||activeTaskContext.globalRoom) return null;
  const {sub,ri}=activeTaskContext;
  const row=sub?.data?.rows?.[ri]; if(!row) return null;
  return ensureTaskState(sub.data,row,ri).remoteProcessStepId||null;
}
// Gegenrichtung: von der Kachel zur PBC-Zeile.
function taskRiForStep(stepId){
  const pbc=luminaPbcRows(); if(!pbc||!stepId) return null;
  const ri=pbc.rows.findIndex((row,i)=>
    String(ensureTaskState(pbc.sub.data,row,i).remoteProcessStepId||'')===String(stepId));
  return ri>=0?ri:null;
}
// Kontext einer Kachel aus Sicht des Modals - dieselbe Form wie guidanceContext().
function taskGuidanceContext(){
  const stepId=taskContextStepId();
  const step=stepId?processStepById(stepId):null;
  if(!step) return null;
  return { step, stepId:step.id, code:step.code, title:processStepLabel(step),
    guide:guidanceByStepId.get(step.id)||guidanceByCode.get(step.code)||null };
}
// Klick auf eine Blattkachel: dieselbe Aufgabe, dasselbe Modal wie aus "Mein Tag".
// Findet sich keine Aufgabe, bleibt die Seitenansicht als Rueckfall - kein toter Klick.
function openTaskModalForStep(stepId,tab='details'){
  const pbc=luminaPbcRows();
  const ri=taskRiForStep(stepId);
  if(!pbc||ri===null){
    view={level:'step',station:view.station,measure:view.measure,stepId};
    render();
    return;
  }
  openTaskModal(pbc.sub,ri,tab);
}
function openTaskModal(sub,ri,tab='details'){activeTaskContext={sub,ri};taskActiveTab=tab==='reminder'?'email':tab;const st=ensureTaskState(sub.data,sub.data.rows[ri],ri);if(tab==='reminder')st.emailKind='reminder';else if(tab==='email')st.emailKind='invite';document.getElementById('task-modal-backdrop').classList.add('open');document.getElementById('task-modal-backdrop').setAttribute('aria-hidden','false');renderTaskModal();}
function closeTaskModal(){document.getElementById('task-modal-backdrop').classList.remove('open');document.getElementById('task-modal-backdrop').setAttribute('aria-hidden','true');activeTaskContext=null;activeCommunicationMessageId=null;activeCommunicationReply=null;}
function globalProcessTitle(number){
  const station=stations.find(s=>String(s.title||'').trim().startsWith(number+'.'));
  const fallback={1:'Prüfungsauftrag & Mandatierung',2:'Projektplanung & Kick-off',3:'Abschlussvorbereitung',4:'Erstellung Einzelabschlüsse',5:'Konsolidierung & Gruppenabschluss',6:'Prüfungsdurchführung',7:'Feststellung & Gremienbeschluss',8:'Veröffentlichung'}[number]||'Weitere Aufgaben';
  return station?.title||`${number}. ${fallback}`;
}
function buildGlobalTaskHierarchy(sub){
  const roots=new Map();
  for(let n=1;n<=8;n++)roots.set(String(n),{key:String(n),title:globalProcessTitle(n),part:n,entries:[],children:new Map()});
  (sub.data.rows||[]).forEach((row,ri)=>{
    const levelText=String(row[1]||''),match=levelText.match(/^\s*(\d+(?:\.\d+)*)\.?\s*(.*)$/),code=match?.[1]||'Weitere',parts=code.split('.'),top=parts[0];
    if(!roots.has(top))roots.set(top,{key:top,title:'Weitere Aufgaben',part:999,entries:[],children:new Map()});
    let node=roots.get(top);
    for(let i=1;i<parts.length;i++){
      const key=parts.slice(0,i+1).join('.'),isLast=i===parts.length-1,label=isLast&&match?.[2]?`${key}. ${match[2]}`:key;
      if(!node.children.has(parts[i]))node.children.set(parts[i],{key,title:label,part:Number(parts[i])||0,entries:[],children:new Map()});
      node=node.children.get(parts[i]);
    }
    node.entries.push({row,ri,sub});
  });
  return [...roots.values()].filter(node=>globalHierarchyCount(node)>0).sort((a,b)=>a.part-b.part);
}
function globalHierarchyCount(node){return node.entries.length+[...node.children.values()].reduce((sum,child)=>sum+globalHierarchyCount(child),0);}
function renderGlobalTaskCard(entry,emailMode){
  const {row,ri,sub}=entry,st=ensureTaskState(sub.data,row,ri),person=responsible(row),due=taskEffectiveDate(row),title=taskDisplayTitle(row,st),search=[row[0],title,row[3],row[1],person.name,person.email,st.workStatus,due].join(' ').toLowerCase();

}
function renderGlobalHierarchyNode(node,emailMode,depth=0){
  const entries=node.entries.map(entry=>renderGlobalTaskCard(entry,emailMode)).join(''),children=[...node.children.values()].sort((a,b)=>a.part-b.part).map(child=>renderGlobalHierarchyNode(child,emailMode,depth+1)).join('');
